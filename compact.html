<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pn 접합 다이오드 (소형)</title>
<style>
/* ==========================================================================
   COMPACT build - made to sit inside a 4:3 PowerPoint slide.
   Everything stacks vertically so the plots keep the full width, and the
   canvas code thins its own annotation out as the panels get smaller.
   ========================================================================== */
:root{
  --bg:#f5f5f7; --card:#fff; --tx:#1d1d1f; --tx2:#6e6e73; --tx3:#8e8e93;
  --sep:rgba(0,0,0,.10); --hair:rgba(0,0,0,.07); --hover:rgba(0,0,0,.05);
  --ac:#0071e3; --ac-soft:rgba(0,113,227,.12);
  --track:#e6e6eb; --thumb:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.06);
  --seg:#ececf0; --segsel:#fff;
  --warn-bg:rgba(255,149,0,.15); --warn-tx:#8a5100;
  --ok-bg:rgba(52,199,89,.16); --ok-tx:#1c7d3e;
  --wr-bg:rgba(255,149,0,.18); --wr-tx:#8a5100;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font:13px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  letter-spacing:-.01em; color:var(--tx); background:var(--bg); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
h2{margin:0;font-weight:600;font-size:13px;letter-spacing:-.015em}
button{font:inherit;cursor:pointer;letter-spacing:inherit}

#app{display:flex;flex-direction:column;height:100%;min-height:0;padding:7px;gap:7px}

/* ---------- header: preset chips ---------- */
#hdr{flex:0 0 auto;display:flex;align-items:center;gap:6px;min-width:0}
.seg{
  display:flex;gap:2px;background:var(--seg);border-radius:9px;padding:2px;
  overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0;
}
.seg::-webkit-scrollbar{display:none}
.seg button{
  border:0;background:transparent;color:var(--tx);font-size:12px;font-weight:500;
  padding:5px 9px;border-radius:7px;white-space:nowrap;min-height:26px;
  transition:background .16s,box-shadow .16s;
}
.seg button:hover{background:var(--hover)}
.seg button.on{background:var(--segsel);box-shadow:0 1px 3px rgba(0,0,0,.13);font-weight:600}
.iconbtn{
  flex:0 0 auto;width:28px;height:28px;border:0;border-radius:8px;background:var(--seg);
  color:var(--tx2);display:grid;place-items:center;font-size:14px;line-height:1;
  transition:background .15s,color .15s;
}
.iconbtn:hover{background:var(--hover);color:var(--tx)}
.iconbtn.on{background:var(--ac);color:#fff}

/* ---------- note ---------- */
#note{flex:0 0 auto}
#note .n{
  background:var(--warn-bg);color:var(--warn-tx);border-radius:9px;
  padding:6px 10px;font-size:12px;line-height:1.35;
}
#note .n b{font-weight:600;margin-right:4px}

/* ---------- plots ---------- */
#plots{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:7px}
.card{
  background:var(--card);border-radius:12px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
#cardMain{flex:1.95 1 0}
#cardIV{flex:1 1 0}
body.single .card{flex:1 1 0}
.cardhead{
  flex:0 0 auto;display:flex;align-items:baseline;gap:7px;
  padding:6px 10px 5px;border-bottom:1px solid var(--hair);
}
.cardhead .hint{font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cvwrap{position:relative;flex:1 1 auto;min-height:0}
canvas{display:block;width:100%;height:100%}

/* ---------- bias bar ---------- */
#bias{
  flex:0 0 auto;background:var(--card);border-radius:12px;box-shadow:var(--shadow);
  padding:7px 12px 8px;
}
#bias .sl{margin:0}
#bias .lab{display:flex;align-items:baseline;gap:6px;margin-bottom:1px}
#bias .lab .nm{font-weight:600;font-size:13px}
#bias .lab .ds{font-size:11px;color:var(--tx3)}
#bias .lab .val{
  margin-left:auto;font-size:16px;font-weight:600;color:var(--ac);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
#bias .lab .val span{color:var(--tx3);font-weight:400;font-size:11px}

/* ---------- collapsible settings ---------- */
#more{
  flex:0 0 auto;display:none;background:var(--card);border-radius:12px;
  box-shadow:var(--shadow);padding:10px 12px;max-height:46vh;overflow-y:auto;
}
#more.open{display:block}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 14px}
@media (max-width:620px){ .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.mtitle{font-size:11px;font-weight:600;color:var(--tx2);margin:8px 0 4px}
.mtitle:first-child{margin-top:0}
.sl{margin-bottom:4px}
.sl .lab{display:flex;align-items:baseline;gap:5px;font-size:12px;margin-bottom:0}
.sl .lab .nm{font-weight:600}
.sl .lab .ds{font-size:10.5px;color:var(--tx3)}
.sl .lab .val{
  margin-left:auto;font-size:12px;font-weight:590;color:var(--ac);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.sl .lab .val span{color:var(--tx3);font-weight:400;font-size:10px}
.sl .row{display:flex;align-items:center;gap:5px}
.sl input[type=range]{flex:1 1 auto;min-width:0}
.step{
  flex:0 0 auto;width:22px;height:22px;border:0;border-radius:6px;background:var(--seg);
  color:var(--tx2);font-size:13px;line-height:1;padding:0;display:grid;place-items:center;
}
.step:hover{background:var(--hover);color:var(--tx)}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:24px;
  background:transparent;cursor:pointer;margin:0;--p:50;
}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--ac) 0 calc(var(--p)*1%),var(--track) calc(var(--p)*1%) 100%);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;
  background:var(--thumb);border:.5px solid rgba(0,0,0,.06);
  box-shadow:0 1px 3px rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.1);
}
#bias input[type=range]{height:26px}
#bias input[type=range]::-webkit-slider-thumb{width:22px;height:22px;margin-top:-9px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--track)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--ac)}
input[type=range]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;background:var(--thumb);
  border:.5px solid rgba(0,0,0,.06);box-shadow:0 1px 3px rgba(0,0,0,.2);
}

/* ---------- readout ---------- */
table.ro{width:100%;border-collapse:collapse;font-size:11.5px}
table.ro td{padding:3px 0;border-top:1px solid var(--hair)}
table.ro tr:first-child td{border-top:0}
table.ro td.k{color:var(--tx2);white-space:nowrap;padding-right:6px}
table.ro td.v{text-align:right;font-weight:590;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:10px;font-weight:600;border-radius:5px;padding:1px 5px;margin-left:4px}
.tag.g{background:var(--ok-bg);color:var(--ok-tx)}
.tag.y{background:var(--wr-bg);color:var(--wr-tx)}
.tag.b{background:var(--ac-soft);color:var(--ac)}

#selftest{
  display:none;position:absolute;inset:0;z-index:50;overflow:auto;margin:0;
  background:var(--card);color:var(--tx);padding:14px;white-space:pre-wrap;
  font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;
}
#selftest.show{display:block}

/* short embeds: give the plots every pixel we can spare */
@media (max-height:560px){
  #app{padding:5px;gap:5px}
  .cardhead{padding:4px 9px 3px}
  .cardhead .hint{display:none}
  #bias{padding:5px 10px 6px}
  #bias .lab .val{font-size:15px}
  .seg button{padding:4px 8px;min-height:24px}
  .iconbtn{width:25px;height:25px}
}
/* below this the J-V panel cannot carry an axis - fold it away and let the
   carrier profile use the whole frame (?plot=iv still shows it full height) */
@media (max-height:440px){
  body:not(.single) #cardIV{display:none}
}
@media (max-height:430px){
  #bias .lab{margin-bottom:-2px}
  #bias .lab .val{font-size:13px}
  #bias input[type=range]{height:22px}
  #bias input[type=range]::-webkit-slider-thumb{width:19px;height:19px;margin-top:-7.5px}
}
</style>
</head>
<body>
<div id="app">

  <div id="hdr">
    <div class="seg" id="presets">
      <button data-preset="long">Long</button>
      <button data-preset="inter">Inter</button>
      <button data-preset="short">Short</button>
      <button data-preset="mixed">p:S / n:L</button>
      <button data-preset="rev">역방향</button>
    </div>
    <button class="iconbtn" id="btnMore" title="파라미터 · 계산값">⚙</button>
    <button class="iconbtn" id="btnLink" title="현재 상태 주소 복사">🔗</button>
  </div>

  <div id="note"></div>

  <div id="plots">
    <section class="card" id="cardMain">
      <div class="cardhead">
        <h2>소수캐리어 분포 · 전류밀도</h2>
        <span class="hint">SCR 경계 접선 기울기 = 전류</span>
      </div>
      <div class="cvwrap"><canvas id="cvMain"></canvas></div>
    </section>
    <section class="card" id="cardIV">
      <div class="cardhead">
        <h2>J–V</h2>
        <span class="hint">J = J<sub>s</sub>(e<sup>eV<sub>a</sub>/kT</sup> − 1)</span>
      </div>
      <div class="cvwrap"><canvas id="cvIV"></canvas></div>
    </section>
  </div>

  <div id="bias"><div id="slBias"></div></div>

  <div id="more">
    <div class="mtitle">중성영역 폭 W · 확산거리 L</div>
    <div class="mgrid"><div id="slW"></div><div id="slL"></div><div id="slDope"></div></div>
    <div class="mtitle">계산값</div>
    <div id="readout"></div>
  </div>

  <pre id="selftest"></pre>
</div>
<script>
"use strict";
/* ==========================================================================
   PHYSICS  -  ideal pn diode, LOW LEVEL INJECTION ONLY
   --------------------------------------------------------------------------
   Deliberately the textbook model and nothing more:
     n_p(0) = n_p0 exp(Va/Vt),  p_n(0) = p_n0 exp(Va/Vt)
   No high injection, no series resistance, no SCR generation, no doping
   dependent mobility / lifetime.  T is fixed at 300 K and D_n, D_p are
   fixed textbook values, so every dial maps onto something visible in the
   lecture figures.
   Units: cm, s, cm^-3, cm^2/s, A/cm^2, V.
   ========================================================================== */
/* PHYSICS-ENGINE-BEGIN */
var PHY = (function () {
  'use strict';

  var Q    = 1.602e-19;      /* C    */
  var KB   = 1.381e-23;      /* J/K  */
  var EPS0 = 8.854e-14;      /* F/cm */
  var ER   = 11.7;           /* Si   */
  var NI   = 1.5e10;         /* cm^-3 at 300 K */
  var T    = 300;
  var VT   = KB * T / Q;     /* 0.02585 V */
  var DN   = 25;             /* cm^2/s, electrons - fixed */
  var DP   = 10;             /* cm^2/s, holes     - fixed */

  /* ---- numerically safe hyperbolic helpers (every exponent stays <= 0) --- */
  function coth(u) {
    if (!isFinite(u)) return 1;
    if (u < 1e-3) return 1 / u + u / 3;
    var e = Math.exp(-2 * u);
    return (1 + e) / (1 - e);
  }
  /* sinh((W-x)/L) / sinh(W/L) : the excess profile shape */
  function shape(x, W, L) {
    var u = W / L;
    if (!isFinite(u) || u < 1e-2) return 1 - x / W;          /* short base */
    var a = (W - x) / L;
    return (Math.exp(a - u) - Math.exp(-a - u)) / (1 - Math.exp(-2 * u));
  }
  /* cosh((W-x)/L) / sinh(W/L) : proportional to the diffusion current */
  function shapeJ(x, W, L) {
    var u = W / L;
    if (!isFinite(u) || u < 1e-2) return 1 / u;              /* short base */
    var a = (W - x) / L;
    return (Math.exp(a - u) + Math.exp(-a - u)) / (1 - Math.exp(-2 * u));
  }

  /* p = {Na, Nd, Wp, Wn, Ln, Lp, Va}   lengths in cm */
  function model(p) {
    var np0 = NI * NI / p.Na;              /* minority electrons in p */
    var pn0 = NI * NI / p.Nd;              /* minority holes in n     */

    var ex = Math.exp(Math.min(p.Va / VT, 500)) - 1;
    var dnp0 = np0 * ex;                   /* excess at x" = 0 */
    var dpn0 = pn0 * ex;                   /* excess at x' = 0 */

    var uP = p.Wp / p.Ln;                  /* p side  W/L */
    var uN = p.Wn / p.Lp;                  /* n side  W/L */

    /* current from the slope at the SCR edge */
    var Jn = Q * DN * dnp0 / p.Ln * coth(uP);
    var Jp = Q * DP * dpn0 / p.Lp * coth(uN);
    var Jtot = Jn + Jp;

    /* saturation current density: same expression with exp(Va/Vt)-1 = 1 */
    var Jsn = Q * DN * np0 / p.Ln * coth(uP);
    var Jsp = Q * DP * pn0 / p.Lp * coth(uN);
    var Js = Jsn + Jsp;

    /* where the tangent at the SCR edge meets the equilibrium level:
       lambda = L tanh(W/L)  ->  L for a long base,  W for a short base.
       These are exactly the two slope formulas on the lecture slide.      */
    var lamP = p.Ln * Math.tanh(uP);
    var lamN = p.Lp * Math.tanh(uN);

    var Vbi = VT * Math.log(p.Na * p.Nd / (NI * NI));
    var dV = Vbi - p.Va;
    var clamped = dV < 1e-4;
    if (clamped) dV = 1e-4;
    var W = Math.sqrt(2 * EPS0 * ER * dV / Q * (1 / p.Na + 1 / p.Nd));
    var xn = W * p.Na / (p.Na + p.Nd);
    var xp = W * p.Nd / (p.Na + p.Nd);

    /* how far the low level injection assumption is being pushed */
    var inj = Math.max(dnp0 / p.Na, dpn0 / p.Nd);

    return {
      Na: p.Na, Nd: p.Nd, Wp: p.Wp, Wn: p.Wn, Ln: p.Ln, Lp: p.Lp, Va: p.Va,
      np0: np0, pn0: pn0, dnp0: dnp0, dpn0: dpn0,
      npE: np0 + dnp0, pnE: pn0 + dpn0,
      uP: uP, uN: uN, lamP: lamP, lamN: lamN,
      Jn: Jn, Jp: Jp, J: Jtot, Js: Js, Jsn: Jsn, Jsp: Jsp,
      Vbi: Vbi, W: W, xn: xn, xp: xp,
      inj: inj, vbiClamped: clamped
    };
  }

  /* excess minority profiles, x measured from the SCR edge [cm] */
  function excP(m, x) { return m.dnp0 * shape(x, m.Wp, m.Ln); }   /* electrons in p */
  function excN(m, x) { return m.dpn0 * shape(x, m.Wn, m.Lp); }   /* holes in n     */

  /* minority diffusion current at a distance x from the SCR edge.
     Both fall from their edge value towards the contact when W >> L
     (recombination in the neutral region) and stay flat when W << L.   */
  function JnAt(m, x) { return Q * DN * m.dnp0 / m.Ln * shapeJ(x, m.Wp, m.Ln); }
  function JpAt(m, x) { return Q * DP * m.dpn0 / m.Lp * shapeJ(x, m.Wn, m.Lp); }

  return {
    Q: Q, NI: NI, VT: VT, DN: DN, DP: DP, T: T, EPS0: EPS0, ER: ER,
    coth: coth, shape: shape, shapeJ: shapeJ,
    model: model, excP: excP, excN: excN, JnAt: JnAt, JpAt: JpAt
  };
})();
/* PHYSICS-ENGINE-END */

/* ==========================================================================
   SELF TEST - checks the six statements the lecture figures make.
   Run with ?test=1 or runSelfTests() from the console.
   ========================================================================== */
/* SELFTEST-BEGIN */
function runSelfTests(verbose) {
  var UM = 1e-4, log = [], nPass = 0, nFail = 0;
  function P(o) {
    var d = { Na: 1e17, Nd: 1e16, Va: 0.45, Wp: 200 * UM, Wn: 200 * UM,
              Ln: 25 * UM, Lp: 25 * UM };
    for (var k in o) if (o.hasOwnProperty(k)) d[k] = o[k];
    return d;
  }
  function rel(a, b) { return Math.abs(a - b) / Math.max(Math.abs(b), 1e-300); }
  function chk(name, ok, detail) {
    if (ok) nPass++; else nFail++;
    log.push((ok ? 'PASS  ' : 'FAIL  ') + name + (detail ? '\n        ' + detail : ''));
  }
  function e(x, n) { return Number(x).toExponential(n === undefined ? 3 : n); }
  var Q = PHY.Q, VT = PHY.VT, DN = PHY.DN, DP = PHY.DP;

  /* 1 */
  (function () {
    var m = PHY.model(P({ Va: 0 }));
    chk('1  Va = 0  ->  과잉 캐리어와 전류가 정확히 0',
        m.dnp0 === 0 && m.dpn0 === 0 && m.J === 0,
        'dnp0=' + e(m.dnp0) + '  dpn0=' + e(m.dpn0) + '  J=' + e(m.J));
  })();

  /* 2 */
  (function () {
    var m = PHY.model(P({ Va: -0.5 }));
    chk('2  역방향 포화  ->  J = −J_s  (그림 2)', rel(m.J, -m.Js) < 1e-6,
        'J=' + e(m.J) + '   −J_s=' + e(-m.Js) + '   n_p(0)/n_p0=' + e(m.npE / m.np0, 2));
  })();

  /* 3  long base */
  (function () {
    var m = PHY.model(P({ Wp: 400 * UM, Ln: 20 * UM }));
    var worst = 0, i;
    for (i = 0; i <= 300; i++) {
      var x = m.Wp * i / 300;
      worst = Math.max(worst, Math.abs(PHY.shape(x, m.Wp, m.Ln) - Math.exp(-x / m.Ln)));
    }
    var Jideal = Q * DN * m.np0 * (Math.exp(m.Va / VT) - 1) / m.Ln;
    chk('3  Long base (W_p/L_n = ' + m.uP.toFixed(0) + ')  ->  지수 감쇠, J_n = eD_n·n_p0(e^{V/Vt}−1)/L_n,  λ = L_n  (그림 5, 9)',
        worst < 0.01 && rel(m.Jn, Jideal) < 0.01 && rel(m.lamP, m.Ln) < 0.01,
        '형상 최대편차 ' + e(worst, 2) + ' · J_n=' + e(m.Jn) + ' vs ' + e(Jideal) +
        ' · λ=' + e(m.lamP * 1e4, 3) + ' µm, L_n=' + e(m.Ln * 1e4, 3) + ' µm');
  })();

  /* 4  short base */
  (function () {
    var m = PHY.model(P({ Wp: 1 * UM, Ln: 60 * UM }));
    var worst = 0, i;
    for (i = 0; i <= 300; i++) {
      var x = m.Wp * i / 300;
      worst = Math.max(worst, Math.abs(PHY.shape(x, m.Wp, m.Ln) - (1 - x / m.Wp)));
    }
    var Jideal = Q * DN * m.np0 * (Math.exp(m.Va / VT) - 1) / m.Wp;
    chk('4  Short base (W_p/L_n = ' + m.uP.toFixed(3) + ')  ->  직선, J_n = eD_n·n_p0(e^{V/Vt}−1)/W_p,  λ = W_p  (그림 4, 9)',
        worst < 0.01 && rel(m.Jn, Jideal) < 0.01 && rel(m.lamP, m.Wp) < 0.01,
        '형상 최대편차 ' + e(worst, 2) + ' · J_n=' + e(m.Jn) + ' vs ' + e(Jideal) +
        ' · λ=' + e(m.lamP * 1e4, 3) + ' µm, W_p=' + e(m.Wp * 1e4, 3) + ' µm');
  })();

  /* 5  J_n(x) + J_p(x) = J_Total everywhere  (figure 3) */
  (function () {
    var m = PHY.model(P({ Wp: 300 * UM, Wn: 300 * UM, Ln: 20 * UM, Lp: 35 * UM }));
    var worst = 0, i;
    for (i = 0; i <= 200; i++) {                     /* p side */
      var jn = PHY.JnAt(m, m.Wp * i / 200);
      worst = Math.max(worst, rel(jn + (m.J - jn), m.J));
    }
    var edgeP = PHY.JnAt(m, 0), edgeN = PHY.JpAt(m, 0);
    chk('5  J_n(x) + J_p(x) = J_Total 이 위치에 무관하게 성립  (그림 3)',
        worst < 1e-12 && rel(edgeP, m.Jn) < 1e-12 && rel(edgeN, m.Jp) < 1e-12,
        'J_Total=' + e(m.J) + '  J_n(−x_p)=' + e(m.Jn) + '  J_p(x_n)=' + e(m.Jp) +
        '  최대 상대편차 ' + e(worst, 1));
  })();

  /* 6  ideal diode equation */
  (function () {
    var ok = true, rows = [], v;
    for (v = -0.6; v <= 0.61; v += 0.3) {
      var m = PHY.model(P({ Va: v }));
      var want = m.Js * (Math.exp(v / VT) - 1);
      if (rel(m.J, want) > 1e-12) ok = false;
      rows.push('Va=' + v.toFixed(1) + '  J=' + e(m.J) + '  J_s(e^{V/Vt}−1)=' + e(want));
    }
    chk('6  J = J_s·(e^{eV_a/kT} − 1) 를 정확히 따름  (그림 2)', ok, rows.join('\n        '));
  })();

  /* x ticks: outward, labels below */
  ctx.textAlign = 'center'; ctx.lineWidth = 1.6;
  var xstep = xt.length > 1 ? (xt[1] - xt[0]) : 1;
  ctx.beginPath();
  for (i = 0; i < xt.length; i++) {
    v = xa.log ? Math.pow(10, xt[i]) : xt[i];
    px = Math.round(xa.t(v)) + .5;
    if (px < box.l - 1 || px > box.r + 1) continue;
    ctx.moveTo(px, box.b); ctx.lineTo(px, box.b + 7);
    if (xa.log) drawPow10(ctx, px, box.b + 7 + FS, xt[i], 'center');
    else ctx.fillText(fmtTick(v, xstep), px, box.b + 7 + FS);
  }
  ctx.stroke();

  /* y ticks: inward, labels outside on the left */
  ctx.textAlign = 'right';
  var ystep = yt.length > 1 ? (yt[1] - yt[0]) : 1;
  ctx.beginPath();
  for (i = 0; i < yt.length; i++) {
    v = ya.log ? Math.pow(10, yt[i]) : yt[i];
    py = Math.round(ya.t(v)) + .5;
    if (py < box.t - 1 || py > box.b + 1) continue;
    ctx.moveTo(box.l, py); ctx.lineTo(box.l + 7, py);
    if (ya.log) drawPow10(ctx, box.l - 6, py + FS * 0.36, yt[i], 'right');
    else ctx.fillText(fmtTick(v, ystep), box.l - 6, py + FS * 0.36);
  }
  ctx.stroke();

  /* titles */
  ctx.fillStyle = COL.text;
  ctx.font = 'bold ' + (FS + 1) + 'px ' + FONTS;
  if (o.xlabel) drawSub(ctx, o.xlabel, (box.l + box.r) / 2, box.b + 7 + FS * 2.2,
                        { align: 'center', size: FS + 1, bold: 1 });
  if (o.ylabel) {
    ctx.save(); ctx.translate(14, (box.t + box.b) / 2); ctx.rotate(-Math.PI / 2);
    drawSub(ctx, o.ylabel, 0, 0, { align: 'center', size: FS + 1, bold: 1 }); ctx.restore();
  }
  ctx.restore();
}

/* polyline with clipping to the plot box; pts = [[x,y],...] in data units   */
function poly(ctx, box, xa, ya, pts, style) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(box.l, box.t, box.r - box.l, box.b - box.t); ctx.clip();
  ctx.lineWidth = style.w || LW;
  ctx.strokeStyle = style.c;
  ctx.setLineDash(style.d || []);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  var started = false, i, px, py;
  for (i = 0; i < pts.length; i++) {
    var vx = pts[i][0], vy = pts[i][1];
    if (!isFinite(vx) || !isFinite(vy) || (ya.log && !(vy > 0)) || (xa.log && !(vx > 0))) { started = false; continue; }
    px = xa.t(vx); py = ya.t(vy);
    if (!isFinite(px) || !isFinite(py)) { started = false; continue; }
    py = Math.max(box.t - 5000, Math.min(box.b + 5000, py));
    if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
function dot(ctx, x, y, r, fill, ring) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832);
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = ring || COL.ring; ctx.stroke();
}
function tagText(ctx, x, y, txt, fg, bg, align) {
  ctx.font = 'bold ' + (FS - 1) + 'px ' + FONTS;
  var w = ctx.measureText(txt).width + 10, h = FS + 8;
  var x0 = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  ctx.fillStyle = bg; ctx.fillRect(x0, y - h + 4, w, h);
  ctx.fillStyle = fg; ctx.textAlign = 'left'; ctx.fillText(txt, x0 + 5, y);
  return w;
}
/* small legend block */
function legend(ctx, x, y, items) {
  ctx.save();
  var LFS = FS - 2, ROW = LFS + 4;
  ctx.font = LFS + 'px ' + FONTS;
  var wmax = 0, i;
  for (i = 0; i < items.length; i++) wmax = Math.max(wmax, measSub(ctx, items[i].t, LFS));
  var w = wmax + 38, h = items.length * ROW + 7;
  ctx.fillStyle = 'rgba(' + COL.haloBase + ',.86)'; ctx.strokeStyle = COL.faint; ctx.lineWidth = 1;
  ctx.fillRect(x, y, w, h); ctx.strokeRect(x + .5, y + .5, w, h);
  for (i = 0; i < items.length; i++) {
    var yy = y + 5 + (i + 0.5) * ROW;
    ctx.strokeStyle = items[i].c; ctx.lineWidth = items[i].w || 3;
    ctx.setLineDash(items[i].d || []);
    ctx.beginPath(); ctx.moveTo(x + 7, yy); ctx.lineTo(x + 29, yy); ctx.stroke();
    ctx.setLineDash([]);
    drawSub(ctx, items[i].t, x + 34, yy + LFS * 0.35, { size: LFS, col: COL.text });
  }
  ctx.restore();
  return h;
}

/* ==========================================================================
   J - V  characteristic  (linear axes, the ideal diode equation)
   ========================================================================== */
var IV_V0 = -1.0, IV_V1 = 0.8;

function drawIV() {
  var cv = $('cvIV');
  if (ONLY === 'profile') return;
  var f = fitCanvas(cv), ctx = f.ctx, w = f.w, h = f.h;
  var m = MODEL; if (!m) return;
  var T = labelTier(w - 70, h - 60);
  var box = COMPACT
    ? { l: Math.round(T > 1 ? FS * 4.6 : FS * 3.6), r: w - 12,
        t: Math.round(FS * (T > 1 ? 2.0 : 1.3)),
        b: h - Math.round(FS * (T > 0 ? 3.3 : 1.8)) }
    : { l: 74, r: w - 18, t: 44, b: h - 62 };
  if (box.r - box.l < 70 || box.b - box.t < (COMPACT ? 34 : 55)) return;

  var Jat = function (v) { return m.Js * (Math.exp(Math.min(v / PHY.VT, 500)) - 1); };
  /* the y axis follows the operating point, so the exponential knee and the
     flat reverse branch are both readable at every bias                     */
  var hi = Math.max(Math.abs(m.J) * 2.4, m.Js * 25);
  var lo = -Math.max(m.Js * 3.2, hi * 0.13);
  var xa = Ax(false, IV_V0, IV_V1, box.l, box.r);
  var ya = Ax(false, lo, hi, box.b, box.t);

  drawFrame(ctx, box, xa, ya, {
    xlabel: T > 0 ? '인가전압  V_a  [V]' : '', ylabel: T > 1 ? 'J  [A/cm²]' : '',
    xn: T > 0 ? 5 : 4, yn: T > 1 ? 5 : 3
  });

  /* zero line */
  ctx.strokeStyle = COL.zero; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(box.l, Math.round(ya.t(0)) + .5);
  ctx.lineTo(box.r, Math.round(ya.t(0)) + .5); ctx.stroke();

  /* the curve */
  var pts = [], i, v;
  for (i = 0; i <= 400; i++) {
    v = IV_V0 + (IV_V1 - IV_V0) * i / 400;
    pts.push([v, Jat(v)]);
  }
  poly(ctx, box, xa, ya, pts, { c: COL.ivCurve, w: LW + 0.6 });

  /* -Js callout: on a linear axis it is indistinguishable from zero,
     which is exactly the point of the figure                            */
  var yJs = ya.t(-m.Js);
  dashLine(ctx, box.l, yJs, box.r, yJs, COL.muted2, [5, 4], 1.4);
  /* the caption sits under the line, or above it when the line is near the floor */
  var lowRoom = (box.b - yJs) < FS * 1.8;
  drawSub(ctx, '−J_s' + (T > 0 ? (' = ' + fmtGc(m.Js, 2) + ' A/cm²') : ''),
          box.l + 8, yJs + (lowRoom ? -5 : FS + 4),
          { align: 'left', size: FS - 2, bold: 1, col: COL.muted2, halo: 0.9 });

  /* operating point */
  var px = xa.t(m.Va), py = Math.max(box.t + 2, Math.min(box.b - 2, ya.t(m.J)));
  ctx.save();
  ctx.beginPath(); ctx.rect(box.l, box.t, box.r - box.l, box.b - box.t); ctx.clip();
  dashLine(ctx, px, box.b, px, py, COL.point, [4, 4], 1.4);
  dot(ctx, px, py, 8, COL.point);
  ctx.restore();
  drawSub(ctx, 'V_a = ' + m.Va.toFixed(3) + ' V' + (T > 0 ? (',  J = ' + fmtGc(m.J, 3) + ' A/cm²') : ''),
          box.r - 4, box.t - (COMPACT ? 5 : 10), { align: 'right', size: FS - 1, bold: 1, col: COL.point });

  /* equation + bias direction labels */
  if (T > 1) {
    drawSub(ctx, 'J = J_s·(e^{eVa/kT} − 1)', box.l + 8, box.t + FS + 6,
            { align: 'left', size: FS + 2, bold: 1, col: COL.ivCurve, halo: 0.9 });
    drawSub(ctx, 'y축은 현재 동작점에 맞춰 자동 확대', box.l + 8, box.t + FS * 2.5 + 4,
            { align: 'left', size: FS - 3, col: COL.dim2, halo: 0.9 });
  }
  if (T > 0) {
    drawSub(ctx, '← Reverse Bias', box.l + 8, box.b - 7,
            { align: 'left', size: FS - 2, col: COL.dim, halo: 0.9 });
    drawSub(ctx, 'Forward Bias →', box.r - 8, box.b - 7,
            { align: 'right', size: FS - 2, col: COL.dim, halo: 0.9 });
  }
}

/* click / drag anywhere on the J-V plot moves Va (mouse only operation) */
function initIVMouse() {
  var cv = $('cvIV'), down = false;
  var set = function (ev) {
    var r = cv.getBoundingClientRect();
    var l = COMPACT ? Math.round(FS * 4.0) : 74, rr = r.width - (COMPACT ? 12 : 18);
    var fr = (ev.clientX - r.left - l) / Math.max(1, rr - l);
    var v = IV_V0 + (IV_V1 - IV_V0) * Math.min(1, Math.max(0, fr));
    v = parseFloat((Math.round(v / 0.005) * 0.005).toFixed(3));
    if (v === S.Va) return;
    S.Va = v; showVal('Va'); pushURL(); recompute();
  };
  cv.style.cursor = 'ew-resize';
  cv.addEventListener('mousedown', function (e) { down = true; set(e); e.preventDefault(); });
  window.addEventListener('mousemove', function (e) { if (down) set(e); });
  window.addEventListener('mouseup', function () { down = false; });
}

var rafPending = false;
function drawAll() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(function () {
    rafPending = false;
    try { drawMain(); } catch (e) { console.error(e); }
    try { drawIV(); } catch (e) { console.error(e); }
  });
}

/* ==========================================================================
   MAIN PANEL  -  minority carrier profile (top) and current density (bottom)
   Both share one horizontal layout, exactly as in the lecture figures:
     [ p neutral region ][ SCR ][ n neutral region ]
   The p side runs right-to-left in x", the n side left-to-right in x'.
   ========================================================================== */
function haloText(ctx, txt, x, y, col, align, size, bold) {
  drawSub(ctx, txt, x, y, { align: align, size: size || FS, bold: bold, col: col, halo: true });
}
function arrowHead(ctx, x, y, dx, dy, col, s) {
  var L = Math.sqrt(dx * dx + dy * dy) || 1;
  dx /= L; dy /= L; s = s || 8;
  var px = -dy, py = dx;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - dx * s + px * s * 0.45, y - dy * s + py * s * 0.45);
  ctx.lineTo(x - dx * s - px * s * 0.45, y - dy * s - py * s * 0.45);
  ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
}
function arrowLine(ctx, x0, y0, x1, y1, col, w) {
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = w || 1.8; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  arrowHead(ctx, x1, y1, x1 - x0, y1 - y0, col, 9);
  ctx.restore();
}
function dashLine(ctx, x0, y0, x1, y1, col, dash, w) {
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = w || 1.6; ctx.setLineDash(dash || [5, 4]);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.restore();
}
/* sample points, dense near the SCR edge where the profile bends */
function sampleX(W, L, n) {
  var xs = [], i, near = Math.min(W, 5 * L);
  for (i = 0; i <= n; i++) xs.push(W * i / n);
  if (near < W) for (i = 0; i <= n; i++) xs.push(near * i / n);
  xs.sort(function (a, b) { return a - b; });
  return xs;
}
function baseWord(u) { return u > 5 ? 'long base' : (u < 0.2 ? 'short base' : 'intermediate'); }

/* ---- shared horizontal layout ------------------------------------------- */
function xLayout(m, l, r) {
  var full = r - l;
  /* the SCR is drawn wider than scale so it stays visible, but it still
     breathes with sqrt(Vbi - Va): wider in reverse, narrower in forward   */
  var f = Math.sqrt(Math.max(m.Vbi - m.Va, 1e-4) / m.Vbi);
  var scr = Math.max(full * 0.035, Math.min(full * 0.26, full * 0.10 * f));
  var half = (full - scr) / 2;
  var cxL = l + half, cxR = cxL + scr;
  return {
    l: l, r: r, cxL: cxL, cxR: cxR, half: half, scr: scr,
    p: function (xpp) { return cxL - (xpp / m.Wp) * half; },   /* x" -> px */
    n: function (xp)  { return cxR + (xp / m.Wn) * half; }     /* x' -> px */
  };
}

function drawMain() {
  var cv = $('cvMain');
  if (ONLY === 'iv') return;
  var f = fitCanvas(cv), ctx = f.ctx, w = f.w, h = f.h;
  var m = MODEL; if (!m) return;

  var M = COMPACT ? Math.max(26, Math.round(FS * 2.4)) : 46;
  var L = M, R = w - M;   /* room for the x" / x' axis captions */
  if (R - L < 120 || h < (COMPACT ? 130 : 220)) return;
  var X = xLayout(m, L, R);

  var aTop = COMPACT ? Math.round(FS * 1.6) : 30;
  var aBot = Math.round(h * (COMPACT ? 0.55 : 0.50));
  var Tm = labelTier(R - L, aBot - aTop);
  var gap  = COMPACT ? Math.round(FS * (Tm > 1 ? 3.5 : 2.7)) : 74;
  var bTop = aBot + gap, bBot = h - (COMPACT ? Math.round(FS * 1.5) : 26);
  if (bBot - bTop < 52) { bTop = aBot + Math.round(gap * 0.7); bBot = h - 12; }

  /* if the current-density strip cannot be read, drop it and give the whole
     canvas to the carrier profile rather than drawing two unusable panels  */
  var showJ = (bBot - bTop) >= 44;
  if (!showJ) aBot = h - Math.round(FS * 2.9);

  drawProfilePanel(ctx, m, X, aTop, aBot);
  if (showJ) drawCurrentPanel(ctx, m, X, bTop, bBot);
}

/* ======================= panel A : carrier profile ======================= */
function drawProfilePanel(ctx, m, X, top, bot) {
  var X0 = X, T = labelTier(X.r - X.l, bot - top);
  var band = T > 0 ? (T > 1 ? 34 : 26) : 8;   /* strip for p_p0 / n_n0 */
  var cTop = top + band + 10, cBot = bot;
  /* one linear scale per side, as the lecture figure draws two "n, p" axes */
  var yMaxP = Math.max(m.npE, m.np0 * 2.2) * 1.12;
  var yMaxN = Math.max(m.pnE, m.pn0 * 2.2) * 1.12;
  var yP = function (v) { return cBot - (v / yMaxP) * (cBot - cTop); };
  var yN = function (v) { return cBot - (v / yMaxN) * (cBot - cTop); };

  /* --- SCR --- */
  ctx.fillStyle = COL.scr;
  ctx.fillRect(X.cxL, top, X.scr, bot - top);
  ctx.save();
  ctx.translate((X.cxL + X.cxR) / 2, (top + bot) / 2);
  if (X.scr < 60) ctx.rotate(-Math.PI / 2);
  drawSub(ctx, 'SCR', 0, 0, { align: 'center', size: FS, bold: 1, col: COL.scrLab });
  ctx.restore();

  /* --- contacts and baseline --- */
  ctx.strokeStyle = COL.contact; ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(X.l + .5, top); ctx.lineTo(X.l + .5, bot);
  ctx.moveTo(X.r - .5, top); ctx.lineTo(X.r - .5, bot);
  ctx.stroke();
  ctx.strokeStyle = COL.axis; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(X.l - 14, bot + .5); ctx.lineTo(X.r + 14, bot + .5); ctx.stroke();
  arrowHead(ctx, X.l - 14, bot + .5, -1, 0, COL.axis, 8);
  arrowHead(ctx, X.r + 14, bot + .5, 1, 0, COL.axis, 8);

  /* vertical "n, p" axes at both SCR edges, as in the figures */
  [X.cxL, X.cxR].forEach(function (cx) {
    arrowLine(ctx, cx, bot, cx, top - 8, COL.axis, 1.6);
  });
  if (T > 1) drawSub(ctx, 'n, p', (X.cxL + X.cxR) / 2, top - 12,
                     { align: 'center', size: FS, bold: 1, col: COL.axisLab });

  /* --- majority reference lines in the top strip (way off scale) --- */
  var hiIsNa = m.Na >= m.Nd;
  var yHi = top + (T > 1 ? 11 : 9), yLo = top + (T > 1 ? 27 : 21);
  if (T > 0) {
  dashLine(ctx, X.l, hiIsNa ? yHi : yLo, X.cxL, hiIsNa ? yHi : yLo, COL.hole, [6, 4], 1.8);
  dashLine(ctx, X.cxR, hiIsNa ? yLo : yHi, X.r, hiIsNa ? yLo : yHi, COL.elec, [6, 4], 1.8);
  var mjP = T > 1 ? ('p_{p0} = ' + fmtEc(m.Na, 1) + '  (축척 밖)') : 'p_{p0}';
  var mjN = T > 1 ? ('n_{n0} = ' + fmtEc(m.Nd, 1) + '  (축척 밖)') : 'n_{n0}';
  haloText(ctx, mjP, X.l + 6, (hiIsNa ? yHi : yLo) - 4, COL.hole, 'left', FS - 3, true);
  haloText(ctx, mjN, X.r - 6, (hiIsNa ? yLo : yHi) - 4, COL.elec, 'right', FS - 3, true);
  ctx.save();                                   /* axis break */
  ctx.strokeStyle = COL.brk; ctx.lineWidth = 1.3; ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.moveTo(X.l, top + band + 2); ctx.lineTo(X.r, top + band + 2); ctx.stroke();
  ctx.restore();
  }

  /* --- equilibrium levels --- */
  dashLine(ctx, X.l, yP(m.np0), X.cxL, yP(m.np0), COL.elec, [4, 4], 1.6);
  dashLine(ctx, X.cxR, yN(m.pn0), X.r, yN(m.pn0), COL.hole, [4, 4], 1.6);

  /* --- profiles --- */
  var i, xs, pts = [];
  xs = sampleX(m.Wp, m.Ln, 240);
  for (i = 0; i < xs.length; i++) pts.push([X.p(xs[i]), yP(m.np0 + PHY.excP(m, xs[i]))]);
  strokePts(ctx, pts, COL.elec, LW + 0.4);
  pts = [];
  xs = sampleX(m.Wn, m.Lp, 240);
  for (i = 0; i < xs.length; i++) pts.push([X.n(xs[i]), yN(m.pn0 + PHY.excN(m, xs[i]))]);
  strokePts(ctx, pts, COL.hole, LW + 0.4);

  /* --- tangent at the SCR edge: it meets the equilibrium level at
         lambda = L tanh(W/L), i.e. at L for a long base and at W for a
         short base.  That is the slide's dn_p/dx formula, drawn.        --- */
  var tan = function (side) {
    var isP = side === 'p';
    var TT = T;
    var lam = isP ? m.lamP : m.lamN;
    var y0 = isP ? yP(m.npE) : yN(m.pnE);
    var y1 = isP ? yP(m.np0) : yN(m.pn0);
    var x0 = isP ? X.cxL : X.cxR;
    var x1 = isP ? X.p(lam) : X.n(lam);
    dashLine(ctx, x0, y0, x1, y1, COL.tangent, [7, 5], 1.8);
    ctx.beginPath(); ctx.arc(x1, y1, 4, 0, 6.2832);
    ctx.fillStyle = COL.tangent; ctx.fill();
    var u = isP ? m.uP : m.uN, nm = isP ? 'L_n' : 'L_p', wn = isP ? 'W_p' : 'W_n';
    if (T < 1) return;
    var lab = (u > 5 ? ('λ = ' + nm) : (u < 0.2 ? ('λ = ' + wn) : 'λ')) + (T > 1 ? (' = ' + fmtLenC(lam)) : '');
    var tw = measSub(ctx, lab, FS - 2, 1);
    var lx = x1 + (isP ? -9 : 9);
    lx = Math.max(X0.l + 4 + (isP ? tw : 0), Math.min(X0.r - 4 - (isP ? 0 : tw), lx));
    haloText(ctx, lab, lx, y1 - 8, COL.tangent, isP ? 'right' : 'left', FS - 2, true);
    if (T > 1) {
      var sl = isP ? 'dn_p/dx″' : 'dp_n/dx′';
      haloText(ctx, sl, (x0 + x1) / 2 + (isP ? -6 : 6), (y0 + y1) / 2 - 8, COL.tangent,
               isP ? 'right' : 'left', FS - 2, true);
    }
  };
  tan('p'); tan('n');

  /* --- edge markers --- */
  dot(ctx, X.cxL, yP(m.npE), 7, COL.elec);
  dot(ctx, X.cxR, yN(m.pnE), 7, COL.hole);
  haloText(ctx, 'n_p(0) = ' + fmtGc(m.npE, 3), X.cxL - 11, yP(m.npE) - 9, COL.elec, 'right', FS - 2, true);
  haloText(ctx, 'p_n(0) = ' + fmtGc(m.pnE, 3), X.cxR + 11, yN(m.pnE) - 9, COL.hole, 'left', FS - 2, true);
  if (T > 0) {
    haloText(ctx, 'n_{p0}', X.l + (X.cxL - X.l) * 0.30, yP(m.np0) + FS + 3, COL.elec, 'center', FS - 2);
    haloText(ctx, 'p_{n0}', X.r - (X.r - X.cxR) * 0.30, yN(m.pn0) + FS + 3, COL.hole, 'center', FS - 2);
  }

  /* --- carrier flow arrows (they reverse with the bias) --- */
  if (Math.abs(m.Va) > 0.02) {
    var fwd = m.Va > 0, ay = cBot - (cBot - cTop) * 0.16, d = 34;
    var xe = X.cxL - X.half * 0.30, xh = X.cxR + X.half * 0.30;
    arrowLine(ctx, xe + (fwd ? d : -d), ay, xe + (fwd ? -d : d), ay, COL.elec, 2.2);
    arrowLine(ctx, xh + (fwd ? -d : d), ay, xh + (fwd ? d : -d), ay, COL.hole, 2.2);
    if (T > 1) {
      haloText(ctx, '전자', xe, ay - 10, COL.elec, 'center', FS - 2, true);
      haloText(ctx, '정공', xh, ay - 10, COL.hole, 'center', FS - 2, true);
    }
  }

  /* --- x axis annotation --- */
  var tickV = function (px, txt, col) {
    ctx.strokeStyle = COL.axis; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(px + .5, bot); ctx.lineTo(px + .5, bot + 7); ctx.stroke();
    if (txt) drawSub(ctx, txt, px, bot + 8 + FS, { align: 'center', size: FS - 1, col: col || COL.text });
  };
  tickV(X.l, ''); tickV(X.cxL, 'x″=0'); tickV(X.cxR, 'x′=0'); tickV(X.r, '');
  if (T > 0) {
    drawSub(ctx, 'x″', X.l - 17, bot + 8 + FS, { align: 'right', size: FS, bold: 1 });
    drawSub(ctx, 'x′', X.r + 17, bot + 8 + FS, { align: 'left', size: FS, bold: 1 });
    /* base type goes under the axis while there is a second row for it */
    drawSub(ctx, (T > 1 ? 'W_p = ' + fmtGc(m.Wp * 1e4, 3) + ' µm · ' : '') + baseWord(m.uP),
            (X.l + X.cxL) / 2, bot + 8 + FS * 2.2, { align: 'center', size: FS - 1, col: COL.elec, bold: 1 });
    drawSub(ctx, (T > 1 ? 'W_n = ' + fmtGc(m.Wn * 1e4, 3) + ' µm · ' : '') + baseWord(m.uN),
            (X.cxR + X.r) / 2, bot + 8 + FS * 2.2, { align: 'center', size: FS - 1, col: COL.hole, bold: 1 });
  } else {
    /* no second row down there - tuck it into the top corners instead */
    drawSub(ctx, baseWord(m.uP), X.l + 4, top + FS + 1,
            { align: 'left', size: FS - 1, col: COL.elec, bold: 1, halo: 0.9 });
    drawSub(ctx, baseWord(m.uN), X.r - 4, top + FS + 1,
            { align: 'right', size: FS - 1, col: COL.hole, bold: 1, halo: 0.9 });
  }
}

/* ======================= panel B : current density ======================= */
function drawCurrentPanel(ctx, m, X, top, bot) {
  var T = labelTier(X.r - X.l, bot - top);
  var lo = Math.min(0, m.J * 1.3), hi = Math.max(0, m.J * 1.3);
  if (hi - lo < 1e-300) { lo = -1; hi = 1; }
  var y = function (v) { return bot - (v - lo) / (hi - lo) * (bot - top); };

  /* SCR guides */
  dashLine(ctx, X.cxL, top - 4, X.cxL, bot, COL.scrGuide, [4, 4], 1.3);
  dashLine(ctx, X.cxR, top - 4, X.cxR, bot, COL.scrGuide, [4, 4], 1.3);
  ctx.fillStyle = COL.scr2;
  ctx.fillRect(X.cxL, top - 4, X.scr, bot - top + 4);

  /* axes */
  ctx.strokeStyle = COL.axis; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(X.l - 14, y(0) + .5); ctx.lineTo(X.r + 14, y(0) + .5); ctx.stroke();
  arrowHead(ctx, X.r + 14, y(0) + .5, 1, 0, COL.axis, 8);
  arrowLine(ctx, (X.cxL + X.cxR) / 2, bot, (X.cxL + X.cxR) / 2, top - 10, COL.axis, 1.6);
  if (T > 1) drawSub(ctx, 'Current density', (X.cxL + X.cxR) / 2, top - 15,
                     { align: 'center', size: FS - 1, bold: 1, col: COL.axisLab, halo: 0.9 });
  drawSub(ctx, 'x', X.r + 18, y(0) + FS * 0.4, { align: 'left', size: FS, bold: 1 });

  /* J_n(x) and J_p(x) */
  var i, xs, jn = [], jp = [];
  xs = sampleX(m.Wp, m.Ln, 200);
  for (i = xs.length - 1; i >= 0; i--) {
    var Jn = PHY.JnAt(m, xs[i]);
    jn.push([X.p(xs[i]), y(Jn)]); jp.push([X.p(xs[i]), y(m.J - Jn)]);
  }
  jn.push([X.cxL, y(m.Jn)]); jp.push([X.cxL, y(m.Jp)]);
  jn.push([X.cxR, y(m.Jn)]); jp.push([X.cxR, y(m.Jp)]);
  xs = sampleX(m.Wn, m.Lp, 200);
  for (i = 0; i < xs.length; i++) {
    var Jp = PHY.JpAt(m, xs[i]);
    jp.push([X.n(xs[i]), y(Jp)]); jn.push([X.n(xs[i]), y(m.J - Jp)]);
  }
  /* J_total */
  ctx.strokeStyle = COL.tot; ctx.lineWidth = LW;
  ctx.beginPath(); ctx.moveTo(X.l, y(m.J)); ctx.lineTo(X.r, y(m.J)); ctx.stroke();
  strokePts(ctx, jn, COL.elec, LW);
  strokePts(ctx, jp, COL.hole, LW);

  dot(ctx, X.cxL, y(m.Jn), 6.5, COL.elec);
  dot(ctx, X.cxR, y(m.Jp), 6.5, COL.hole);

  /* labels straight from the lecture figure */
  haloText(ctx, (T > 1 ? 'J_{Total} = J_n(−x_p) + J_p(x_n) = ' : 'J_{Total} = ') +
           fmtGc(m.J, 3) + ' A/cm²',
           (X.l + X.r) / 2, top + FS - 2, COL.tot, 'center', FS - 2, true);
  if (T > 0) {
    haloText(ctx, 'J_n(−x_p)', X.cxL - 10, y(m.Jn) - 9, COL.elec, 'right', FS - 2, true);
    haloText(ctx, 'J_p(x_n)', X.cxR + 10, y(m.Jp) - 9, COL.hole, 'left', FS - 2, true);
  }
  /* the two "= J_Total - X" curves approach J_Total from inside, so their
     captions go on the far side of the curve from the J_Total line        */
  if (T > 1) {
    var xlp = m.Wp * 0.42, xln = m.Wn * 0.42;
    var jnp = PHY.JnAt(m, xlp), jpn = PHY.JpAt(m, xln);
    var oDiff = m.J >= 0 ? -9 : (FS + 7);      /* diffusion curves: outward */
    var oComp = m.J >= 0 ? (FS + 7) : -9;      /* complement curves: inward */
    haloText(ctx, 'J_n = eD_n·d(δn_p)/dx', X.p(xlp), y(jnp) + oDiff, COL.elec, 'center', FS - 3);
    haloText(ctx, 'J_p = J_{Total} − J_n', X.p(xlp), y(m.J - jnp) + oComp, COL.hole, 'center', FS - 3);
    haloText(ctx, 'J_p = −eD_p·d(δp_n)/dx', X.n(xln), y(jpn) + oDiff, COL.hole, 'center', FS - 3);
    haloText(ctx, 'J_n = J_{Total} − J_p', X.n(xln), y(m.J - jpn) + oComp, COL.elec, 'center', FS - 3);
  }
  if (T > 0 && m.uP < 0.35 && m.uN < 0.35)
    haloText(ctx, '중성영역 재결합 거의 없음 → J_n, J_p 각각 일정',
             (X.l + X.r) / 2, top + FS * 2.4, COL.muted, 'center', FS - 2, true);
  drawSub(ctx, 'p', X.l + 10, top + FS, { align: 'left', size: FS, bold: 1, col: COL.scrLab });
  drawSub(ctx, 'n', X.r - 10, top + FS, { align: 'right', size: FS, bold: 1, col: COL.scrLab });
}

/* plain polyline in pixel coordinates */
function strokePts(ctx, pts, col, w) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.setLineDash([]);
  ctx.beginPath();
  var started = false;
  for (var i = 0; i < pts.length; i++) {
    if (!isFinite(pts[i][0]) || !isFinite(pts[i][1])) { started = false; continue; }
    if (!started) { ctx.moveTo(pts[i][0], pts[i][1]); started = true; }
    else ctx.lineTo(pts[i][0], pts[i][1]);
  }
  ctx.stroke();
  ctx.restore();
}

/* ==========================================================================
   COMPACT skin - turns on the adaptive annotation and wires the settings
   drawer.  Everything else is the same engine as the other two builds.
   ========================================================================== */
COMPACT = true;

function initSkin() {
  var more = document.getElementById('more'), btn = document.getElementById('btnMore');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var open = more.classList.toggle('open');
    btn.classList.toggle('on', open);
    if (typeof drawAll === 'function') drawAll();     /* panels resized */
  });
}

/* ========================================================================== */
var MODEL = null;

function recompute() {
  MODEL = PHY.model(phyParams());
  updateReadout(MODEL);
  updateNote(MODEL);
  drawAll();
}
function copyLink() {
  var url = buildURL(), b = $('btnLink'), old = b.textContent;
  var done = function (ok) {
    b.textContent = ok ? '복사됨 ✓' : '복사 실패';
    setTimeout(function () { b.textContent = old; }, 1500);
  };
  try {
    var ta = document.createElement('textarea');
    ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) { done(true); return; }
  } catch (e) {}
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(
    function () { done(true); }, function () { window.prompt('아래 주소를 복사하세요', url); });
  else window.prompt('아래 주소를 복사하세요', url);
}

function boot() {
  var q = readURL();
  mkSlider($('slBias'), 'Va');
  mkSlider($('slW'), 'Wp'); mkSlider($('slW'), 'Wn');
  mkSlider($('slL'), 'Ln'); mkSlider($('slL'), 'Lp');
  mkSlider($('slDope'), 'Na'); mkSlider($('slDope'), 'Nd');
  buildReadout();

  Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function (e) {
    e.addEventListener('click', function () { applyPreset(e.getAttribute('data-preset')); });
  });
  $('btnLink').addEventListener('click', copyLink);

  if (EMBED) document.body.classList.add('embed');
  if (ONLY) {
    document.body.classList.add('single');
    $(ONLY === 'iv' ? 'cardMain' : 'cardIV').style.display = 'none';
  }

  if (typeof initTheme === 'function') initTheme();
  if (typeof initSkin === 'function') initSkin();
  syncControls();
  initIVMouse();
  recompute();

  if (q.test === '1') {
    var p = $('selftest');
    p.textContent = runSelfTests(false).text + '\n\n(클릭하면 닫힙니다)';
    p.classList.add('show');
    p.addEventListener('click', function () { p.classList.remove('show'); });
  }

  window.addEventListener('resize', drawAll);
  if (window.ResizeObserver) new ResizeObserver(drawAll).observe($('plots'));
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
