<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pn 접합 다이오드 시뮬레이터</title>
<style>
/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font:16px/1.45 Arial, Helvetica, sans-serif;
  color:#16191d; background:#eef1f5;
  overflow:hidden;                 /* the app scrolls internally, not the top */
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;font-weight:bold}
button{font:inherit;font-size:15px;cursor:pointer}

#app{display:flex;flex-direction:column;height:100%;min-height:0}

/* ---------- header ---------- */
#hdr{
  flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
  padding:9px 14px;background:#1d2c44;color:#fff;
}
#hdr h1{font-size:19px;letter-spacing:-.2px}
#hdr .sub{font-size:14px;font-weight:normal;color:#a9bcd8;margin-left:8px}
#presets{display:flex;flex-wrap:wrap;gap:7px;margin-left:auto}
#presets button{
  background:#31517d;color:#fff;border:1px solid #4a6da3;border-radius:6px;
  padding:7px 12px;min-height:34px;
}
#presets button:hover{background:#3e6499}
#presets button.alt{background:#0d1a2e;border-color:#3a5580}
.linkbtn{
  background:#0e1a2c;color:#cfe0f8;border:1px solid #3f5a82;border-radius:6px;
  padding:7px 12px;min-height:34px;
}
.linkbtn:hover{background:#16263f}

/* ---------- warning banners ---------- */
#banners{flex:0 0 auto}
.banner{
  padding:8px 14px;font-size:15px;font-weight:bold;border-bottom:1px solid rgba(0,0,0,.12);
  display:flex;gap:8px;align-items:baseline;
}
.banner .why{font-weight:normal}
.banner.warn{background:#ffe9c7;color:#7a4a00}
.banner.bad {background:#ffd9d9;color:#8c1616}
.banner.info{background:#dceafc;color:#173a68}

/* ---------- layout ---------- */
#main{flex:1 1 auto;display:flex;min-height:0;gap:10px;padding:10px}
#ctrl{
  flex:0 0 336px;min-width:0;overflow-y:auto;overflow-x:hidden;
  background:#fff;border:1px solid #ccd4de;border-radius:8px;padding:12px 13px 18px;
}
#plots{
  flex:1 1 auto;min-width:0;display:grid;gap:10px;
  grid-template-columns:repeat(auto-fit,minmax(430px,1fr));
  grid-auto-rows:minmax(300px,1fr);overflow:auto;
}
.card{
  background:#fff;border:1px solid #ccd4de;border-radius:8px;
  display:flex;flex-direction:column;min-height:300px;min-width:0;overflow:hidden;
}
.cardhead{
  flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;
  padding:8px 10px;border-bottom:1px solid #e2e7ee;background:#f7f9fc;
}
.cardhead h2{font-size:16px;white-space:nowrap}
.cardhead .toggles{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.cvwrap{position:relative;flex:1 1 auto;min-height:0}
canvas{display:block;width:100%;height:100%}
.plotbadge{
  position:absolute;left:8px;top:8px;max-width:70%;
  background:rgba(255,226,226,.94);border:1px solid #d98b8b;color:#8c1616;
  font-size:13.5px;font-weight:bold;padding:4px 8px;border-radius:5px;pointer-events:none;
}
.j0line{
  flex:0 0 auto;padding:7px 10px;border-top:1px solid #e2e7ee;background:#f7f9fc;
  font-size:15px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;
}
.j0line b{font-size:18px;color:#123a6b;font-family:"Courier New",monospace}

/* ---------- small toggle buttons ---------- */
.tg{
  border:1px solid #b7c2d0;background:#fff;color:#2b3440;border-radius:6px;
  padding:5px 10px;min-height:30px;font-size:14px;
}
.tg:hover{background:#eef3fa}
.tg.on{background:#2b6cb0;border-color:#2b6cb0;color:#fff}
.tg.on:hover{background:#3579c0}
.seg{display:inline-flex;border:1px solid #b7c2d0;border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;color:#2b3440;padding:5px 10px;min-height:30px;font-size:14px}
.seg button+button{border-left:1px solid #b7c2d0}
.seg button.on{background:#2b6cb0;color:#fff}

/* ---------- sliders ---------- */
.group{margin-bottom:14px}
.grouptitle{
  font-size:13px;font-weight:bold;letter-spacing:.06em;color:#5c6a7c;
  text-transform:uppercase;margin:0 0 7px;
  border-bottom:1px solid #e2e7ee;padding-bottom:4px;
}
.sl{margin-bottom:11px}
.sl .lab{display:flex;align-items:baseline;gap:6px;font-size:15px;margin-bottom:1px}
.sl .lab .nm{font-weight:bold}
.sl .lab .val{margin-left:auto;font-family:"Courier New",monospace;font-size:15px;color:#123a6b}
.sl .row{display:flex;align-items:center;gap:4px}
.sl input[type=range]{flex:1 1 auto;min-width:0}
.step{
  flex:0 0 auto;width:28px;height:28px;line-height:1;padding:0;font-size:16px;
  border:1px solid #b7c2d0;background:#fff;border-radius:5px;color:#2b3440;
}
.step:hover{background:#eef3fa}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:28px;
  background:transparent;cursor:pointer;margin:0;
}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:#ccd6e2;border-radius:4px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;
  background:#2b6cb0;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);
}
input[type=range]::-moz-range-track{height:8px;background:#ccd6e2;border-radius:4px}
input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:#2b6cb0;border:2px solid #fff;
  box-shadow:0 1px 3px rgba(0,0,0,.35);
}
input[type=range].warn::-webkit-slider-thumb{background:#c0392b}
input[type=range].warn::-moz-range-thumb{background:#c0392b}

/* ---------- readout ---------- */
table.ro{width:100%;border-collapse:collapse;font-size:14.5px}
table.ro td{padding:2px 0;vertical-align:baseline}
table.ro td.k{color:#4a5666;white-space:nowrap;padding-right:6px}
table.ro td.v{
  text-align:right;font-family:"Courier New",monospace;color:#11294a;
  white-space:nowrap;font-size:14.5px;
}
table.ro tr.sep td{border-top:1px solid #e8ecf2;padding-top:5px}
.tag{
  display:inline-block;font-family:Arial,Helvetica,sans-serif;font-size:12.5px;
  font-weight:bold;border-radius:4px;padding:1px 6px;margin-left:5px;color:#fff;
}
.tag.g{background:#2e7d4f}.tag.y{background:#b8860b}.tag.r{background:#c0392b}
.tag.b{background:#2b6cb0}.tag.n{background:#6b7684}
.help{cursor:help;color:#2b6cb0;font-weight:bold}

/* ---------- override panel ---------- */
.ovhead{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:bold;
  padding:6px 0;cursor:pointer;user-select:none}
.ovhead .car{color:#2b6cb0;font-size:13px}
.ovbody{display:none;border-left:3px solid #dbe3ec;padding-left:9px;margin-bottom:6px}
.ovbody.open{display:block}
.ovrow{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.ovrow label{font-size:14.5px}
.reset{
  margin-left:auto;font-size:12.5px;padding:3px 7px;min-height:26px;
  border:1px solid #b7c2d0;background:#fff;border-radius:5px;color:#2b3440;
}
.reset:hover{background:#eef3fa}
.chk{display:flex;align-items:center;gap:7px;font-size:15px;margin:4px 0;cursor:pointer}
.chk input{width:20px;height:20px;cursor:pointer}
.note{font-size:13px;color:#5c6a7c;line-height:1.35;margin-top:4px}

/* ---------- self test output ---------- */
#selftest{
  display:none;position:absolute;inset:0;z-index:50;overflow:auto;margin:0;
  background:#101820;color:#d7e3f0;font:13px/1.4 "Courier New",monospace;padding:14px;
  white-space:pre-wrap;
}
#selftest.show{display:block}

/* ---------- embed / single-plot modes ---------- */
body.embed #hdr{padding:6px 10px}
body.embed #hdr h1,body.embed #hdr .sub{display:none}
body.embed #presets{margin-left:0}
body.single #plots{grid-template-columns:1fr}

/* ---------- narrow: fold into one column, plots first ---------- */
@media (max-width:820px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  #main{flex-direction:column}
  #ctrl{flex:0 0 auto;width:auto;overflow:visible;order:2}
  #plots{grid-template-columns:1fr;overflow:visible;order:1}
  .card{height:min(56vh,380px)}
  #hdr h1{font-size:17px}
  #presets{margin-left:0}
}
</style>
</head>
<body>
<div id="app">

  <div id="hdr">
    <h1>pn 접합 다이오드 시뮬레이터<span class="sub">소수캐리어 분포와 J–V 특성</span></h1>
    <div id="presets">
      <button data-preset="lecture">강의 예제</button>
      <button data-preset="long">Long base</button>
      <button data-preset="short">Short base</button>
      <button data-preset="high">고준위 주입 관찰</button>
      <button class="linkbtn" id="btnLink" title="현재 슬라이더 상태가 담긴 주소를 복사합니다">링크 복사</button>
      <button class="linkbtn" id="btnTest" title="물리 엔진 자체 검증 12항목을 실행합니다">자체 검증</button>
    </div>
  </div>

  <div id="banners"></div>

  <div id="main">

    <div id="ctrl">
      <div class="group">
        <div class="grouptitle">소자 파라미터</div>
        <div id="slDevice"></div>
      </div>

      <div class="group">
        <div class="grouptitle">동작 조건</div>
        <div id="slBias"></div>
        <label class="chk"><input type="checkbox" data-bind="rs"><span>직렬저항 포함 &nbsp;V<sub>j</sub> = V<sub>a</sub> − J·R<sub>s</sub>A</span></label>
        <label class="chk"><input type="checkbox" data-bind="gen"><span>역방향 SCR 생성전류 포함</span></label>
      </div>

      <div class="group">
        <div class="grouptitle">계산값</div>
        <div id="readout"></div>
      </div>

      <div class="group">
        <div class="ovhead" id="ovHead"><span class="car">▶</span>고급 · 자동 계산값 덮어쓰기</div>
        <div class="ovbody" id="ovBody">
          <div class="note">도핑–이동도–수명 결합을 끊고 개별 파라미터의 영향만 관찰할 때 사용합니다.
            체크를 풀면 자동 모델로 되돌아갑니다.</div>
          <label class="chk"><input type="checkbox" data-bind="ovrTau"><span>수명 τ 직접 지정</span></label>
          <div id="slTau"></div>
          <label class="chk"><input type="checkbox" data-bind="ovrD"><span>확산계수 D 직접 지정</span></label>
          <div id="slD"></div>
          <label class="chk"><input type="checkbox" data-bind="ovrL"><span>확산거리 L 직접 지정</span></label>
          <div id="slL"></div>
          <div class="note">L을 직접 지정하지 않으면 L = √(D·τ) 로 따라옵니다.</div>
        </div>
      </div>
    </div>

    <div id="plots">

      <section class="card" id="cardProfile">
        <div class="cardhead">
          <h2>캐리어 농도 프로파일</h2>
          <div class="toggles">
            <span class="seg">
              <button data-mode="log">전체 (log)</button>
              <button data-mode="exc">과잉 캐리어만 (linear)</button>
            </span>
            <button class="tg logOnly" data-bind="pzoom">접합 근처 확대</button>
            <button class="tg excOnly" data-bind="yfix">y 고정</button>
            <button class="tg excOnly" data-bind="pnorm">각 곡선 정규화</button>
          </div>
        </div>
        <div class="cvwrap">
          <canvas id="cvProfile"></canvas>
          <div class="plotbadge" id="badgeProfile" style="display:none"></div>
        </div>
      </section>

      <section class="card" id="cardIV">
        <div class="cardhead">
          <h2>J–V 특성</h2>
          <div class="toggles">
            <span class="seg">
              <button data-ivy="lin">linear</button>
              <button data-ivy="log">semi-log |J|</button>
            </span>
            <button class="tg" data-bind="ivdecomp">J<sub>n</sub>/J<sub>p</sub> 분해</button>
            <button class="tg" data-bind="ivslope">기울기 보조선</button>
            <button class="tg" data-bind="rs">R<sub>s</sub></button>
            <button class="tg" data-bind="gen">생성전류</button>
          </div>
        </div>
        <div class="cvwrap">
          <canvas id="cvIV"></canvas>
        </div>
        <div class="j0line" id="j0line"></div>
      </section>

    </div>
  </div>
  <pre id="selftest"></pre>
</div>
<script>
"use strict";
/* ==========================================================================
   PHYSICS ENGINE  (pure functions, no DOM access)
   --------------------------------------------------------------------------
   Internal unit system is cm-s-V throughout:
     concentration [cm^-3], mobility [cm^2/V.s], diffusivity [cm^2/s],
     length [cm], time [s], current density [A/cm^2], voltage [V].
   Only the UI layer converts to um / ns / us for display.
   ========================================================================== */
/* PHYSICS-ENGINE-BEGIN */
var PHY = (function () {
  'use strict';

  /* ---------------- 1. constants ---------------- */
  var Q    = 1.602e-19;    /* elementary charge            [C]    */
  var KB   = 1.381e-23;    /* Boltzmann constant           [J/K]  */
  var EPS0 = 8.854e-14;    /* vacuum permittivity          [F/cm] */
  var ER   = 11.7;         /* Si relative permittivity            */
  var NI300 = 1.5e10;      /* ni(300 K) used by the lecture notes */

  /* 2. ni(T) = A (T/300)^2.54 exp(-6726/T).
     A is normalised so that ni(300 K) is exactly NI300 = 1.5e10 cm^-3.
     (The raw model gives ~1.0e10, which would not match hand calculations.) */
  var NI_A = NI300 / Math.exp(-6726 / 300);

  function vTherm(T) { return KB * T / Q; }               /* kT/q  [V]      */
  function niOfT(T)  { return NI_A * Math.pow(T / 300, 2.54) * Math.exp(-6726 / T); }

  /* ---------------- 3. mobility: Caughey-Thomas (Si, 300 K) ---------------- */
  function muN300(N) { return 65.0 + (1330 - 65.0) / (1 + Math.pow(N / 8.5e16, 0.72)); }
  function muP300(N) { return 47.7 + (495 - 47.7) / (1 + Math.pow(N / 6.3e16, 0.76)); }
  /* optional temperature extension (lattice scattering exponents) */
  function muN(N, T) { return muN300(N) * Math.pow(T / 300, -2.42); }
  function muP(N, T) { return muP300(N) * Math.pow(T / 300, -2.20); }

  /* ---------------- 4. lifetime: Scharfetter SRH in parallel with Auger ----
     These are *derived* from the doping sliders - they are not user dials.  */
  var CP_AUG = 9.9e-32;    /* [cm^6/s] Auger coefficient, p-side electrons  */
  var CN_AUG = 2.8e-31;    /* [cm^6/s] Auger coefficient, n-side holes      */
  function tauNof(Na) { return 1 / ((1 + Na / 1e16) / 1.0e-5 + CP_AUG * Na * Na); }
  function tauPof(Nd) { return 1 / ((1 + Nd / 1e16) / 3.0e-6 + CN_AUG * Nd * Nd); }

  /* ---------------- numerically safe helpers ---------------- */

  /* coth(u), stable for u -> 0 and u -> inf */
  function coth(u) {
    if (!isFinite(u)) return 1;
    if (u < 1e-3) return 1 / u + u / 3;          /* series, avoids 0/0        */
    var e = Math.exp(-2 * u);                    /* argument always <= 0      */
    return (1 + e) / (1 - e);
  }

  /* sinh((W-x)/L) / sinh(W/L)  -- the long/short base shape factor.
     Written so every exponential argument is <= 0: no overflow for any W/L. */
  function shapeRatio(x, W, L) {
    var u = W / L;
    if (!isFinite(u) || u < 1e-2) return 1 - x / W;   /* short base -> linear */
    var a = (W - x) / L;                              /* 0 <= a <= u          */
    return (Math.exp(a - u) - Math.exp(-a - u)) / (1 - Math.exp(-2 * u));
  }

  /* Exact SCR boundary law (section 8): solves simultaneously
        p * n  = ni^2 exp(Vj/Vt)        (junction law, any injection level)
        n - p  = Nmaj                   (quasi-neutrality, any injection level)
     ->  p = [ -Nmaj + sqrt(Nmaj^2 + 4S) ] / 2 ,   S = ni^2 exp(Vj/Vt)
     The rationalised form below removes the catastrophic cancellation that
     ruins  -Nmaj + sqrt(Nmaj^2 + eps)  under reverse / small forward bias. */
  function minorityAtEdge(Nmaj, ni, vt, Vj) {
    var lnS = 2 * Math.log(ni) + Vj / vt;             /* work in log space   */
    if (lnS > 700) lnS = 700;                         /* clamp: keeps finite */
    var S = Math.exp(lnS);
    return 2 * S / (Nmaj + Math.sqrt(Nmaj * Nmaj + 4 * S));
  }

  /* ---------------- static (bias independent) part of the model ---------- */
  /* p = {Na, Nd, Wp, Wn, T, ovrTau, tau_n, tau_p, ovrD, Dn, Dp, ovrL, Ln, Lp}
     Wp, Wn are quasi-neutral widths in cm.                                  */
  function build(p) {
    var T = p.T, vt = vTherm(T), ni = niOfT(T);

    /* minority-carrier mobilities: electrons live in the p side (doping Na),
       holes live in the n side (doping Nd)                                  */
    var mun_min = muN(p.Na, T);
    var mup_min = muP(p.Nd, T);
    /* majority-carrier mobilities, used only by the series resistance (12)  */
    var mun_maj = muN(p.Nd, T);     /* electrons are majority in the n side  */
    var mup_maj = muP(p.Na, T);     /* holes are majority in the p side      */

    var tauN_auto = tauNof(p.Na), tauP_auto = tauPof(p.Nd);
    var tau_n = p.ovrTau ? p.tau_n : tauN_auto;
    var tau_p = p.ovrTau ? p.tau_p : tauP_auto;

    var Dn_auto = vt * mun_min, Dp_auto = vt * mup_min;
    var Dn = p.ovrD ? p.Dn : Dn_auto;
    var Dp = p.ovrD ? p.Dp : Dp_auto;

    var Ln_auto = Math.sqrt(Dn * tau_n), Lp_auto = Math.sqrt(Dp * tau_p);
    var Ln = p.ovrL ? p.Ln : Ln_auto;
    var Lp = p.ovrL ? p.Lp : Lp_auto;

    /* Equilibrium minority densities.  Evaluated from the *same* exact law at
       Vj = 0 rather than from ni^2/N, so that the excess densities vanish
       identically at zero bias (J(0) = 0 to machine precision).  The two
       differ by a relative (ni/N)^2 <= 2e-8 over the whole slider range. */
    var pn0 = minorityAtEdge(p.Nd, ni, vt, 0);
    var np0 = minorityAtEdge(p.Na, ni, vt, 0);

    var Vbi = vt * Math.log(p.Na * p.Nd / (ni * ni));

    /* series resistance of the two quasi-neutral bulks (majority transport) */
    var RsA = p.Wn / (Q * mun_maj * p.Nd) + p.Wp / (Q * mup_maj * p.Na);

    var uN = p.Wn / Lp;             /* n-side  base length / hole  diff.len. */
    var uP = p.Wp / Ln;             /* p-side  base length / elec. diff.len. */

    /* low-injection saturation current density including the coth(W/L)
       geometry factor: reduces to q ni^2 (Dp/(Lp Nd) + Dn/(Ln Na)) for a long
       base, and to q ni^2 (Dp/(Nd Wn) + Dn/(Na Wp)) for a short base.       */
    var J0p = Q * ni * ni * Dp * coth(uN) / (Lp * p.Nd);
    var J0n = Q * ni * ni * Dn * coth(uP) / (Ln * p.Na);

    var tau_g = Math.sqrt(tau_n * tau_p);

    return {
      Na: p.Na, Nd: p.Nd, Wp: p.Wp, Wn: p.Wn, T: T,
      vt: vt, ni: ni,
      mun_min: mun_min, mup_min: mup_min, mun_maj: mun_maj, mup_maj: mup_maj,
      tauN_auto: tauN_auto, tauP_auto: tauP_auto, tau_n: tau_n, tau_p: tau_p,
      Dn_auto: Dn_auto, Dp_auto: Dp_auto, Dn: Dn, Dp: Dp,
      Ln_auto: Ln_auto, Lp_auto: Lp_auto, Ln: Ln, Lp: Lp,
      pn0: pn0, np0: np0, Vbi: Vbi, RsA: RsA,
      uN: uN, uP: uP, cothN: coth(uN), cothP: coth(uP),
      J0p: J0p, J0n: J0n, J0: J0p + J0n, tau_g: tau_g
    };
  }

  /* ---------------- bias dependent part: everything at a given Vj -------- */
  function stateAt(b, Vj, opt) {
    var gen = opt && opt.gen;

    /* --- 8. SCR boundary values, no low-injection approximation --- */
    var pnE = minorityAtEdge(b.Nd, b.ni, b.vt, Vj);   /* holes at n edge    */
    var npE = minorityAtEdge(b.Na, b.ni, b.vt, Vj);   /* electrons at p edge*/
    var nnE = pnE + b.Nd;                             /* quasi-neutrality   */
    var ppE = npE + b.Na;
    var dpn0 = pnE - b.pn0;
    var dnp0 = npE - b.np0;

    /* --- 10. ambipolar (injection dependent) diffusivity ---
       Low injection  -> Dp (resp. Dn);  high injection -> 2 Dn Dp/(Dn+Dp).
       Note: the *diffusion lengths* keep their low-injection values; solving
       L self-consistently at high injection is beyond the scope here.      */

      }

              ovrTau: false, tau_n: 1e-8, tau_p: 3e-7,

      if (bad) ok = false;

               '  dnp0=' + e(s.dnp0) + '  J=' + e(s.J));

        'dpn0=' + e(s.dpn0) + '  -pn0=' + e(-b.pn0) + '  (rel ' + e(e1, 1) + ')\n        ' +

             'Ln=' + (b.Ln / UM).toFixed(2) + ' um (exp 3.0)   Lp=' + (b.Lp / UM).toFixed(2) + ' um (exp 17)',
             'J0=' + e(b.J0) + ' A/cm2 (exp 1.2e-11)'].join('\n        ');
    chk('9  lecture preset (tau override 10 ns / 300 ns)',
        rel(b.Dn, 8.8) < 0.02 && rel(b.Dp, 9.4) < 0.02 &&
        rel(b.Ln / UM, 3.0) < 0.03 && rel(b.Lp / UM, 17) < 0.03 &&
        rel(b.J0, 1.2e-11) < 0.05, d);

             'Ln=' + (b.Ln / UM).toFixed(2) + ' um (exp 13)   Lp=' + (b.Lp / UM).toFixed(2) + ' um (exp 31)',
             'J0=' + e(b.J0) + ' A/cm2 (exp 6.0e-12)'].join('\n        ');

  var head = '=== pn diode simulator - physics self test ===';
  var tail = '=== ' + nPass + ' passed, ' + nFail + ' failed ===';
  var text = [head].concat(log).concat([tail]).join('\n');

  var a = log ? Math.log10(lo) : lo, b = log ? Math.log10(hi) : hi;

     the p side - so only guard against a degenerate one */
  if (!isFinite(a) || !isFinite(b) || a === b) { a = a || 0; b = a + 1; }
  return {
    log: log, lo: lo, hi: hi, a: a, b: b, p0: p0, p1: p1,
    t: function (v) {
      var x = log ? Math.log10(v) : v;
      return p0 + (x - a) / (b - a) * (p1 - p0);
    },
    inv: function (px) {
      var x = a + (px - p0) / (p1 - p0) * (b - a);
      return log ? Math.pow(10, x) : x;
    }

    var fr = (ev.clientX - r.left - box.l) / Math.max(1, box.r - box.l);
    var v = IV_V0 + (IV_V1 - IV_V0) * Math.min(1, Math.max(0, fr));
    v = Math.round(v / 0.005) * 0.005;
    if (v === S.Va) return;
    S.Va = parseFloat(v.toFixed(3)); showVal('Va'); pushURL(); recompute();
  };
  cv.style.cursor = 'ew-resize';
  cv.addEventListener('mousedown', function (e) { down = true; set(e); e.preventDefault(); });
  window.addEventListener('mousemove', function (e) { if (down) set(e); });
  window.addEventListener('mouseup', function () { down = false; });
}

/* ---- redraw scheduler ---- */
var rafPending = false;
function drawAll() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(function () {
    rafPending = false;
    try { if (typeof drawProfile === 'function') drawProfile(); } catch (e) { console.error(e); }
    try { drawIV(); } catch (e) { console.error(e); }
  });
}

/* ==========================================================================
   PLOT 1  -  carrier concentration profile
     mode A "log"  : full picture, both carriers, log axis   (slide 1)
     mode B "exc"  : excess minority carriers only, linear   (slide 2)
   ========================================================================== */
function haloText(ctx, txt, x, y, col, align, size, bold) {
  drawSub(ctx, txt, x, y, { align: align, size: size || FS, bold: bold, col: col, halo: true });
}
function arrow(ctx, x, y0, y1, col) {
  if (Math.abs(y1 - y0) < 3) return;
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
  var d = y1 < y0 ? -1 : 1;
  ctx.beginPath();
  ctx.moveTo(x, y1); ctx.lineTo(x - 5.5, y1 - d * 8); ctx.lineTo(x + 5.5, y1 - d * 8);
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  ctx.restore();
}
/* sample points: uniform over the base plus a fine grid near the SCR edge */
function sampleX(W, L, n) {
  var xs = [], i, near = Math.min(W, 6 * L);
  for (i = 0; i <= n; i++) xs.push(W * i / n);
  if (near < W) for (i = 0; i <= n; i++) xs.push(near * i / n);
  xs.sort(function (a, b) { return a - b; });
  return xs;
}

var badgePad = 0;
function drawProfile() {
  var cv = $('cvProfile');
  if (ONLY === 'iv') return;
  var f = fitCanvas(cv), ctx = f.ctx, w = f.w, h = f.h;
  if (!MODEL) return;
  var bg = $('badgeProfile');                 /* keep the badge from covering */
  badgePad = (bg && bg.style.display !== 'none') ? bg.offsetHeight + 10 : 0;
  if (S.pmode === 'exc') drawProfileExcess(ctx, w, h);
  else drawProfileLog(ctx, w, h);
}

/* ---------------- mode A : everything, log scale ---------------- */
function drawProfileLog(ctx, w, h) {
  var m = MODEL, b = m.base, U = 1e4;                 /* cm -> um */
  var xpU = m.xp * U, xnU = m.xn * U;
  var xLo = -(S.Wp + xpU), xHi = xnU + S.Wn;
  if (S.pzoom) {                       /* zoom to a few diffusion lengths */
    xLo = -(xpU + Math.min(S.Wp, 5 * b.Ln * U));
    xHi = xnU + Math.min(S.Wn, 5 * b.Lp * U);
  }
  var box = { l: 82, r: w - 16, t: 14 + badgePad, b: h - 50 };
  if (box.r - box.l < 60 || box.b - box.t < 60) return;

  var ymax = Math.max(b.Na, b.Nd, m.ppE, m.nnE) * 3;
  var ymin = Math.min(b.np0, b.pn0) / 100;
  if (ymax / ymin > 1e24) ymin = ymax / 1e24;
  ymax = Math.pow(10, Math.ceil(Math.log10(ymax)));
  ymin = Math.pow(10, Math.floor(Math.log10(ymin)));
  var xa = Ax(false, xLo, xHi, box.l, box.r), ya = Ax(true, ymin, ymax, box.b, box.t);

  /* space charge region */
  var pxL = xa.t(-xpU), pxR = xa.t(xnU), exaggerated = false;
  if (pxR - pxL < 6) { var c = (pxL + pxR) / 2; pxL = c - 3; pxR = c + 3; exaggerated = true; }
  ctx.fillStyle = COL.scr; ctx.fillRect(pxL, box.t, pxR - pxL, box.b - box.t);

  drawFrame(ctx, box, xa, ya, {
    xlabel: '위치 x [µm]   (0 = 야금학적 접합)',
    ylabel: '캐리어 농도 [cm⁻³]', xn: 6
  });

  /* ---- curves ---- */
  var xsP = sampleX(S.Wp * UM, b.Ln, 260), xsN = sampleX(S.Wn * UM, b.Lp, 260);
  var npC = [], ppC = [], pnC = [], nnC = [], i, xx, d;
  for (i = 0; i < xsP.length; i++) {                  /* p side, x'' from edge */
    xx = xsP[i]; d = PHY.excessP(m, xx);
    var xu = -(xpU + xx * U);
    npC.push([xu, b.np0 + d]); ppC.push([xu, b.Na + d]);
  }
  for (i = 0; i < xsN.length; i++) {                  /* n side, x' from edge  */
    xx = xsN[i]; d = PHY.excessN(m, xx);
    var xu2 = xnU + xx * U;
    pnC.push([xu2, b.pn0 + d]); nnC.push([xu2, b.Nd + d]);
  }

  /* equilibrium references */
  poly(ctx, box, xa, ya, [[xLo, b.np0], [-xpU, b.np0]], { c: COL.elec, w: 1.6, d: [3, 5] });
  poly(ctx, box, xa, ya, [[xnU, b.pn0], [xHi, b.pn0]], { c: COL.hole, w: 1.6, d: [3, 5] });

  /* dotted continuation through the SCR (no model inside) */
  poly(ctx, box, xa, ya, [[-xpU, m.npE], [xnU, m.nnE]], { c: COL.elec, w: 2, d: [2, 4] });
  poly(ctx, box, xa, ya, [[-xpU, m.ppE], [xnU, m.pnE]], { c: COL.hole, w: 2, d: [2, 4] });

  poly(ctx, box, xa, ya, ppC, { c: COL.hole });       /* majority holes  (p) */
  poly(ctx, box, xa, ya, nnC, { c: COL.elec });       /* majority elec.  (n) */
  poly(ctx, box, xa, ya, npC, { c: COL.elec });       /* minority elec.  (p) */
  poly(ctx, box, xa, ya, pnC, { c: COL.hole });       /* minority holes  (n) */

  /* ---- injection markers + arrows at both SCR edges ---- */
  ctx.save();
  ctx.beginPath(); ctx.rect(box.l, box.t, box.r - box.l, box.b - box.t); ctx.clip();
  var clampY = function (v) { return Math.max(box.t + 3, Math.min(box.b - 3, ya.t(Math.max(v, ymin * 1.02)))); };
  var yE0 = ya.t(b.np0), yE1 = clampY(m.npE);
  var yH0 = ya.t(b.pn0), yH1 = clampY(m.pnE);
  arrow(ctx, pxL, yE0, yE1, COL.elec); dot(ctx, pxL, yE1, 7.5, COL.elec);
  arrow(ctx, pxR, yH0, yH1, COL.hole); dot(ctx, pxR, yH1, 7.5, COL.hole);
  var offE = (yE1 - box.t) < (box.b - box.t) * 0.3 ? FS + 16 : -12;
  var offH = (yH1 - box.t) < (box.b - box.t) * 0.3 ? FS + 16 : -12;
  haloText(ctx, 'n_p(0) = ' + fmtGc(m.npE, 3), pxL - 10, yE1 + offE, COL.elec, 'right', FS - 1, true);
  haloText(ctx, 'p_n(0) = ' + fmtGc(m.pnE, 3), pxR + 10, yH1 + offH, COL.hole, 'left', FS - 1, true);
  ctx.restore();

  /* ---- inline labels ---- */
  ctx.save();
  ctx.beginPath(); ctx.rect(box.l, box.t, box.r - box.l, box.b - box.t); ctx.clip();
  /* majority labels hug the outer contacts and sit *below* their line, so
     they clear both the region captions above and the minority curves */
  var majY = function (v) {                    /* below the line, never under */
    var y = ya.t(v) + FS + 7;                  /* the region caption above     */
    return Math.max(y, box.t + FS * 2.6);
  };
  haloText(ctx, 'p_p ≈ N_a', box.l + 6, majY(m.ppE), COL.hole, 'left', FS, true);
  haloText(ctx, 'n_n ≈ N_d', box.r - 6, majY(m.nnE), COL.elec, 'right', FS, true);
  haloText(ctx, 'n_{p0}', box.l + 6, ya.t(b.np0) + FS + 3, COL.elec, 'left', FS - 1);
  haloText(ctx, 'p_{n0}', box.r - 6, ya.t(b.pn0) + FS + 3, COL.hole, 'right', FS - 1);
  ctx.restore();

  /* ---- region + SCR annotation ---- */
  drawSub(ctx, 'p 영역', box.l + 6, box.t + FS + 2,
          { align: 'left', size: FS, bold: 1, col: '#5c6a7c', halo: 0.8 });
  drawSub(ctx, 'n 영역', box.r - 6, box.t + FS + 2,
          { align: 'right', size: FS, bold: 1, col: '#5c6a7c', halo: 0.8 });
  ctx.save();
  ctx.translate((pxL + pxR) / 2, box.b - 8); ctx.rotate(-Math.PI / 2);
  drawSub(ctx, 'SCR  W = ' + fmtLenC(m.W) + (exaggerated ? '  (폭 과장 표시)' : ''), 0, 4,
          { align: 'left', size: FS - 2, bold: 1, col: '#55627a', halo: 0.8 });
  ctx.restore();
}

/* ---------------- mode B : excess carriers only, linear ---------------- */
var yFix = null;
function drawProfileExcess(ctx, w, h) {
  var m = MODEL, b = m.base, U = 1e4;
  var box = { l: 100, r: w - 16, t: 16 + badgePad, b: h - 50 };
  if (box.r - box.l < 60 || box.b - box.t < 60) return;

  /* per-side view length: show the whole base, or 5 diffusion lengths */
  var Vp = Math.min(S.Wp, 5 * b.Ln * U), Vn = Math.min(S.Wn, 5 * b.Lp * U);
  var split = (Vp / Vn > 4 || Vn / Vp > 4);
  if (!split) Vp = Vn = Math.max(Vp, Vn);

  var gap = 5;                                   /* half width of the SCR gap */
  var cx = (box.l + box.r) / 2;
  var xaP = Ax(false, Vp, 0, box.l, cx - gap);   /* p side: x'' grows leftward */
  var xaN = Ax(false, 0, Vn, cx + gap, box.r);

  /* y range */
  var A = m.dnp0, B = m.dpn0, ylo, yhi;
  if (S.pnorm) { ylo = Math.min(0, -1.08); yhi = 1.08; if (A >= 0 && B >= 0) ylo = 0; }
  else {
    var mx = Math.max(A, B, 0), mn = Math.min(A, B, 0);
    yhi = mx > 0 ? mx * 1.08 : Math.abs(mn) * 0.08;
    ylo = mn < 0 ? mn * 1.08 : -(yhi * 0.04);
  }
  if (S.yfix && yFix) { ylo = yFix[0]; yhi = yFix[1]; } else yFix = [ylo, yhi];
  var ya = Ax(false, ylo, yhi, box.b, box.t);

  /* frame: drawn once per half so that each side keeps its own x ticks */
  var i, t, v, px;
  ctx.fillStyle = COL.scr;
  ctx.fillRect(cx - gap, box.t, 2 * gap, box.b - box.t);
  var halfFrame = function (xa, view, skipZero) {
    var ticks = linTicks(0, view, 4);
    ctx.strokeStyle = COL.grid; ctx.lineWidth = 1; ctx.beginPath();
    for (i = 0; i < ticks.length; i++) {
      px = Math.round(xa.t(ticks[i])) + .5;
      if (px > box.l && px < box.r) { ctx.moveTo(px, box.t); ctx.lineTo(px, box.b); }
    }
    ctx.stroke();
    ctx.strokeStyle = COL.axis; ctx.lineWidth = 1.6; ctx.fillStyle = COL.text;
    ctx.font = FS + 'px Arial, Helvetica, sans-serif'; ctx.textAlign = 'center';
    ctx.beginPath();
    for (i = 0; i < ticks.length; i++) {
      px = Math.round(xa.t(ticks[i])) + .5;
      if (px < box.l - 1 || px > box.r + 1) continue;
      ctx.moveTo(px, box.b); ctx.lineTo(px, box.b + 7);
      if (skipZero && ticks[i] === 0) continue;      /* the n side prints it */
      ctx.fillText(fmtTick(ticks[i], ticks.length > 1 ? ticks[1] - ticks[0] : 1), px, box.b + 7 + FS);
    }
    ctx.stroke();
  };
  /* horizontal grid + y axis */
  var yt = linTicks(ylo, yhi, 6);
  ctx.strokeStyle = COL.grid; ctx.lineWidth = 1; ctx.beginPath();
  for (i = 0; i < yt.length; i++) {
    var py = Math.round(ya.t(yt[i])) + .5;
    if (py > box.t && py < box.b) { ctx.moveTo(box.l, py); ctx.lineTo(box.r, py); }
  }
  ctx.stroke();
  halfFrame(xaP, Vp, true); halfFrame(xaN, Vn);
  ctx.strokeStyle = COL.axis; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(box.l + .5, box.t); ctx.lineTo(box.l + .5, box.b + .5); ctx.lineTo(box.r, box.b + .5);
  ctx.stroke();
  ctx.fillStyle = COL.text; ctx.font = FS + 'px Arial, Helvetica, sans-serif';
  ctx.textAlign = 'right'; ctx.lineWidth = 1.6; ctx.beginPath();
  var ystep = yt.length > 1 ? yt[1] - yt[0] : 1;
  for (i = 0; i < yt.length; i++) {
    var py2 = Math.round(ya.t(yt[i])) + .5;
    if (py2 < box.t - 1 || py2 > box.b + 1) continue;
    ctx.moveTo(box.l, py2); ctx.lineTo(box.l + 7, py2);
    drawSub(ctx, S.pnorm ? fmtTick(yt[i], ystep) : fmtGc(yt[i], 2),
            box.l - 6, py2 + FS * 0.36, { align: 'right', size: FS, col: COL.text });
    ctx.textAlign = 'right';
  }
  ctx.stroke();
  drawSub(ctx, 'SCR 경계로부터의 거리 [µm]' + (split ? '   ← 좌우 축척 다름 →' : ''),
          (box.l + box.r) / 2, box.b + 7 + FS * 2.2, { align: 'center', size: FS + 1, bold: 1 });
  ctx.save(); ctx.translate(15, (box.t + box.b) / 2); ctx.rotate(-Math.PI / 2);
  drawSub(ctx, S.pnorm ? '과잉 캐리어  δ / δ(0)' : '과잉 캐리어 농도 [cm⁻³]', 0, 0,
          { align: 'center', size: FS + 1, bold: 1 });
  ctx.restore();

  /* ---- the two excess profiles ---- */
  var kP = S.pnorm ? (A !== 0 ? 1 / Math.abs(A) * (A < 0 ? -1 : 1) : 0) : 1;
  var kN = S.pnorm ? (B !== 0 ? 1 / Math.abs(B) * (B < 0 ? -1 : 1) : 0) : 1;
  var xsP = sampleX(Math.min(S.Wp, Vp) * UM, b.Ln, 300);
  var xsN = sampleX(Math.min(S.Wn, Vn) * UM, b.Lp, 300);
  var cP = [], cN = [];
  for (i = 0; i < xsP.length; i++) cP.push([xsP[i] * U, PHY.excessP(m, xsP[i]) * kP]);
  for (i = 0; i < xsN.length; i++) cN.push([xsN[i] * U, PHY.excessN(m, xsN[i]) * kN]);
  poly(ctx, box, xaP, ya, cP, { c: COL.elec, w: LW + 0.4 });
  poly(ctx, box, xaN, ya, cN, { c: COL.hole, w: LW + 0.4 });

  /* zero line */
  ctx.strokeStyle = '#aab4c0'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(box.l, Math.round(ya.t(0)) + .5);
  ctx.lineTo(box.r, Math.round(ya.t(0)) + .5); ctx.stroke();

  /* ---- L and W markers ---- */
  var vmark = function (xa, val, lim, txt, col, dash, row) {
    if (!(val > 0) || val > lim * 1.001) return;
    var px = Math.round(xa.t(val)) + .5;
    ctx.save();
    ctx.strokeStyle = col; ctx.lineWidth = 1.8; ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(px, box.t + 2); ctx.lineTo(px, box.b); ctx.stroke();
    ctx.restore();
    var tw = measSub(ctx, txt, FS - 1, 1);
    var lx = Math.min(box.r - tw / 2 - 3, Math.max(box.l + tw / 2 + 3, px));
    haloText(ctx, txt, lx, box.t + FS * (row === 2 ? 4.0 : 2.6), col, 'center', FS - 1, true);
  };
  vmark(xaP, b.Ln * U, Vp, 'L_n = ' + fmtLenC(b.Ln), COL.elec, [6, 4]);
  vmark(xaN, b.Lp * U, Vn, 'L_p = ' + fmtLenC(b.Lp), COL.hole, [6, 4]);
  vmark(xaP, S.Wp, Vp, 'W_p = ' + fmtGc(S.Wp) + ' µm', '#4a5666', [2, 3], 2);
  vmark(xaN, S.Wn, Vn, 'W_n = ' + fmtGc(S.Wn) + ' µm', '#4a5666', [2, 3], 2);

  /* ---- side annotations ---- */
  ctx.textAlign = 'center';
  haloText(ctx, 'p 영역:  δn_p(x″)   ' + (b.uP > 5 ? 'long base' : b.uP < 0.2 ? 'short base' : 'intermediate'),
           (box.l + cx) / 2, box.b - 14, COL.elec, 'center', FS, true);
  haloText(ctx, 'n 영역:  δp_n(x′)   ' + (b.uN > 5 ? 'long base' : b.uN < 0.2 ? 'short base' : 'intermediate'),
           (cx + box.r) / 2, box.b - 14, COL.hole, 'center', FS, true);
  haloText(ctx, 'δn_p(0) = ' + fmtE0(A), box.l + 8, box.t + FS + 4, COL.elec, 'left', FS - 1, true);
  haloText(ctx, 'δp_n(0) = ' + fmtE0(B), box.r - 8, box.t + FS + 4, COL.hole, 'right', FS - 1, true);
}
function fmtE0(v) { return (v === 0 ? '0' : fmtGc(v, 3)) + ' cm⁻³'; }

/* ==========================================================================
   BOOT
   ========================================================================== */
var MODEL = null;

function recompute() {
  MODEL = PHY.solve(phyParams());
  updateReadout(MODEL);
  updateBanners(MODEL);
  var bp = $('badgeProfile');
  if (MODEL.r >= 1) {
    bp.style.display = ''; bp.innerHTML = '저준위 주입 가정 위배 — 분포 형상은 근사';
  } else bp.style.display = 'none';
  $('j0line').innerHTML =
    '<span>J<sub>0</sub> = <b>' + fmtE(MODEL.base.J0, 3) + '</b> A/cm<sup>2</sup></span>' +
    '<span>J(V<sub>a</sub>=' + S.Va.toFixed(3) + ') = <b>' + fmtE(MODEL.J, 3) + '</b> A/cm<sup>2</sup></span>' +
    '<span style="color:#5c6a7c">V<sub>j</sub> = ' + MODEL.Vj.toFixed(4) + ' V · ' +
    'J<sub>n</sub> = ' + fmtE(MODEL.Jn, 2) + ' · J<sub>p</sub> = ' + fmtE(MODEL.Jp, 2) + '</span>';
  if (typeof drawAll === 'function') drawAll();
}

function autoValue(key) {                 /* what the model would produce */
  if (key === 'tau_n') return PHY.build(phyParams({ ovrTau: false })).tau_n * 1e9;
  if (key === 'tau_p') return PHY.build(phyParams({ ovrTau: false })).tau_p * 1e9;
  if (key === 'Dn') return PHY.build(phyParams({ ovrD: false })).Dn;
  if (key === 'Dp') return PHY.build(phyParams({ ovrD: false })).Dp;
  if (key === 'Ln') return PHY.build(phyParams({ ovrL: false })).Ln / UM;
  if (key === 'Lp') return PHY.build(phyParams({ ovrL: false })).Lp / UM;
  return S[key];
}
function resetToAuto(key) {
  var d = SLDEF[key];
  S[key] = Math.min(d.max, Math.max(d.min, autoValue(key)));
  showVal(key); pushURL(); recompute();
}

function copyLink() {
  var url = buildURL();
  var done = function (ok) {
    var b = $('btnLink'), old = b.textContent;
    b.textContent = ok ? '복사됨 ✓' : '복사 실패';
    setTimeout(function () { b.textContent = old; }, 1500);
  };
  try {
    var ta = document.createElement('textarea');
    ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) { done(true); return; }
  } catch (e) { /* fall through */ }
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(function () { done(true); }, function () { window.prompt('아래 주소를 복사하세요', url); });
  } else window.prompt('아래 주소를 복사하세요', url);
}

function boot() {
  var q = readURL();

  mkSlider($('slDevice'), 'Na'); mkSlider($('slDevice'), 'Nd');
  mkSlider($('slDevice'), 'Wp'); mkSlider($('slDevice'), 'Wn');
  mkSlider($('slBias'), 'Va');  mkSlider($('slBias'), 'T');
  var R = { reset: resetToAuto };
  mkSlider($('slTau'), 'tau_n', R); mkSlider($('slTau'), 'tau_p', R);
  mkSlider($('slD'), 'Dn', R);      mkSlider($('slD'), 'Dp', R);
  mkSlider($('slL'), 'Ln', R);      mkSlider($('slL'), 'Lp', R);

  buildReadout();
  initBinds();

  $('ovHead').addEventListener('click', function () {
    var b = $('ovBody'), open = b.classList.toggle('open');
    $('ovHead').querySelector('.car').textContent = open ? '▼' : '▶';
  });
  $('btnLink').addEventListener('click', copyLink);
  $('btnTest').addEventListener('click', function () {
    var p = $('selftest');
    if (p.classList.contains('show')) { p.classList.remove('show'); return; }
    p.textContent = runSelfTests(false).text + '\n\n(다시 누르면 닫힙니다)';
    p.classList.add('show');
    p.addEventListener('click', function () { p.classList.remove('show'); }, { once: true });
  });

  if (EMBED) document.body.classList.add('embed');
  if (ONLY) {
    document.body.classList.add('single');
    $(ONLY === 'iv' ? 'cardProfile' : 'cardIV').style.display = 'none';
  }
  if (S.ovrTau || S.ovrD || S.ovrL) {
    $('ovBody').classList.add('open');
    $('ovHead').querySelector('.car').textContent = '▼';
  }

  syncControls();
  initIVMouse();
  recompute();
  if (q.test === '1') $('btnTest').click();

  var redraw = function () { if (typeof drawAll === 'function') drawAll(); };
  window.addEventListener('resize', redraw);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(redraw);
    ro.observe($('plots'));
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
