<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pn 접합 다이오드 시뮬레이터</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font:16px/1.45 Arial, Helvetica, sans-serif;
  color:#16191d; background:#eef1f5; overflow:hidden;
  -webkit-text-size-adjust:100%;
}
h1,h2{margin:0;font-weight:bold}
button{font:inherit;font-size:15px;cursor:pointer}

#app{display:flex;flex-direction:column;height:100%;min-height:0}

/* ---------- header ---------- */
#hdr{
  flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
  padding:9px 14px;background:#1d2c44;color:#fff;
}
#hdr h1{font-size:19px;letter-spacing:-.2px}
#hdr .sub{font-size:14px;font-weight:normal;color:#a9bcd8;margin-left:8px}
#presets{display:flex;flex-wrap:wrap;gap:7px;margin-left:auto}
#presets button{
  background:#31517d;color:#fff;border:1px solid #4a6da3;border-radius:6px;
  padding:7px 12px;min-height:34px;
}
#presets button:hover{background:#3e6499}
#presets button.linkbtn{background:#0e1a2c;border-color:#3f5a82;color:#cfe0f8}
#presets button.linkbtn:hover{background:#16263f}

/* ---------- note strip ---------- */
#note{flex:0 0 auto}
#note .n{
  padding:7px 14px;font-size:14.5px;background:#fff3d6;color:#7a4a00;
  border-bottom:1px solid rgba(0,0,0,.1);
}
#note .n b{margin-right:6px}

/* ---------- layout ---------- */
#main{flex:1 1 auto;display:flex;min-height:0;gap:10px;padding:10px}
#ctrl{
  flex:0 0 300px;min-width:0;overflow-y:auto;overflow-x:hidden;
  background:#fff;border:1px solid #ccd4de;border-radius:8px;padding:12px 13px 18px;
}
#plots{
  flex:1 1 auto;min-width:0;display:grid;gap:10px;overflow:hidden;
  grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);
}
body.single #plots{grid-template-columns:1fr}
.card{
  background:#fff;border:1px solid #ccd4de;border-radius:8px;
  display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;
}
.cardhead{
  flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;
  padding:7px 11px;border-bottom:1px solid #e2e7ee;background:#f7f9fc;
}
.cardhead h2{font-size:16px;white-space:nowrap}
.cardhead .hint{font-size:13.5px;color:#5c6a7c}
.cvwrap{position:relative;flex:1 1 auto;min-height:0}
canvas{display:block;width:100%;height:100%}

/* ---------- sliders ---------- */
.grouptitle{
  font-size:13px;font-weight:bold;letter-spacing:.06em;color:#5c6a7c;
  text-transform:uppercase;margin:0 0 7px;border-bottom:1px solid #e2e7ee;padding-bottom:4px;
}
.group{margin-bottom:15px}
.sl{margin-bottom:11px}
.sl .lab{display:flex;align-items:baseline;gap:6px;font-size:15px;margin-bottom:1px}
.sl .lab .nm{font-weight:bold}
.sl .lab .ds{font-size:13.5px;color:#5c6a7c}
.sl .lab .val{margin-left:auto;font-family:"Courier New",monospace;font-size:15px;color:#123a6b}
.sl .row{display:flex;align-items:center;gap:4px}
.sl input[type=range]{flex:1 1 auto;min-width:0}
.step{
  flex:0 0 auto;width:28px;height:28px;line-height:1;padding:0;font-size:16px;
  border:1px solid #b7c2d0;background:#fff;border-radius:5px;color:#2b3440;
}
.step:hover{background:#eef3fa}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:28px;
  background:transparent;cursor:pointer;margin:0;
}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:#ccd6e2;border-radius:4px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;
  background:#2b6cb0;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);
}
input[type=range]::-moz-range-track{height:8px;background:#ccd6e2;border-radius:4px}
input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:#2b6cb0;border:2px solid #fff;
  box-shadow:0 1px 3px rgba(0,0,0,.35);
}
#slBias input[type=range]::-webkit-slider-thumb{width:26px;height:26px;margin-top:-9px;background:#c8102e}
#slBias input[type=range]::-moz-range-thumb{width:24px;height:24px;background:#c8102e}

/* ---------- readout ---------- */
table.ro{width:100%;border-collapse:collapse;font-size:14.5px}
table.ro td{padding:2px 0;vertical-align:baseline}
table.ro td.k{color:#4a5666;white-space:nowrap;padding-right:6px}
table.ro td.v{text-align:right;font-family:"Courier New",monospace;color:#11294a;white-space:nowrap}
.tag{
  display:inline-block;font-family:Arial,Helvetica,sans-serif;font-size:12.5px;
  font-weight:bold;border-radius:4px;padding:1px 6px;margin-left:5px;color:#fff;
}
.tag.g{background:#2e7d4f}.tag.y{background:#b8860b}.tag.b{background:#2b6cb0}

#selftest{
  display:none;position:absolute;inset:0;z-index:50;overflow:auto;margin:0;
  background:#101820;color:#d7e3f0;font:13px/1.4 "Courier New",monospace;padding:14px;
  white-space:pre-wrap;
}
#selftest.show{display:block}

body.embed #hdr h1,body.embed #hdr .sub{display:none}
body.embed #hdr{padding:6px 10px}
body.embed #presets{margin-left:0}

@media (max-width:900px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  #main{flex-direction:column}
  #ctrl{flex:0 0 auto;width:auto;overflow:visible;order:2}
  #plots{grid-template-columns:1fr;overflow:visible;order:1}
  .card{height:min(70vh,520px)}
  #hdr h1{font-size:17px}
  #presets{margin-left:0}
}
</style>
</head>
<body>
<div id="app">

  <div id="hdr">
    <h1>pn 접합 다이오드<span class="sub">소수캐리어 분포 · 전류밀도 · J–V</span></h1>
    <div id="presets">
      <button data-preset="long">Long base</button>
      <button data-preset="inter">Intermediate</button>
      <button data-preset="short">Short base</button>
      <button data-preset="mixed">p:short / n:long</button>
      <button data-preset="rev">역방향</button>
      <button class="linkbtn" id="btnLink" title="현재 상태가 담긴 주소를 복사합니다">링크 복사</button>
    </div>
  </div>

  <div id="note"></div>

  <div id="main">

    <div id="ctrl">
      <div class="group">
        <div class="grouptitle">바이어스</div>
        <div id="slBias"></div>
      </div>
      <div class="group">
        <div class="grouptitle">중성영역 폭 W</div>
        <div id="slW"></div>
      </div>
      <div class="group">
        <div class="grouptitle">확산거리 L</div>
        <div id="slL"></div>
      </div>
      <div class="group">
        <div class="grouptitle">도핑</div>
        <div id="slDope"></div>
      </div>
      <div class="group">
        <div class="grouptitle">계산값</div>
        <div id="readout"></div>
      </div>
    </div>

    <div id="plots">
      <section class="card" id="cardMain">
        <div class="cardhead">
          <h2>소수캐리어 분포와 전류밀도</h2>
          <span class="hint">SCR 경계의 <b>접선 기울기</b>가 전류를 결정합니다</span>
        </div>
        <div class="cvwrap"><canvas id="cvMain"></canvas></div>
      </section>

      <section class="card" id="cardIV">
        <div class="cardhead">
          <h2>J–V 특성</h2>
          <span class="hint">J = J<sub>s</sub>·(e<sup>eV<sub>a</sub>/kT</sup> − 1)</span>
        </div>
        <div class="cvwrap"><canvas id="cvIV"></canvas></div>
      </section>
    </div>
  </div>
  <pre id="selftest"></pre>
</div>
<script>
"use strict";
/* ==========================================================================
   PHYSICS  -  ideal pn diode, LOW LEVEL INJECTION ONLY
   --------------------------------------------------------------------------
   Deliberately the textbook model and nothing more:
     n_p(0) = n_p0 exp(Va/Vt),  p_n(0) = p_n0 exp(Va/Vt)
   No high injection, no series resistance, no SCR generation, no doping
   dependent mobility / lifetime.  T is fixed at 300 K and D_n, D_p are
   fixed textbook values, so every dial maps onto something visible in the
   lecture figures.
   Units: cm, s, cm^-3, cm^2/s, A/cm^2, V.
   ========================================================================== */
/* PHYSICS-ENGINE-BEGIN */
var PHY = (function () {
  'use strict';

  var Q    = 1.602e-19;      /* C    */
  var KB   = 1.381e-23;      /* J/K  */
  var EPS0 = 8.854e-14;      /* F/cm */
  var ER   = 11.7;           /* Si   */
  var NI   = 1.5e10;         /* cm^-3 at 300 K */
  var T    = 300;
  var VT   = KB * T / Q;     /* 0.02585 V */
  var DN   = 25;             /* cm^2/s, electrons - fixed */
  var DP   = 10;             /* cm^2/s, holes     - fixed */

  /* ---- numerically safe hyperbolic helpers (every exponent stays <= 0) --- */
  function coth(u) {
    if (!isFinite(u)) return 1;
    if (u < 1e-3) return 1 / u + u / 3;
    var e = Math.exp(-2 * u);
    return (1 + e) / (1 - e);
  }
  /* sinh((W-x)/L) / sinh(W/L) : the excess profile shape */
  function shape(x, W, L) {
    var u = W / L;
    if (!isFinite(u) || u < 1e-2) return 1 - x / W;          /* short base */
    var a = (W - x) / L;
    return (Math.exp(a - u) - Math.exp(-a - u)) / (1 - Math.exp(-2 * u));
  }
  /* cosh((W-x)/L) / sinh(W/L) : proportional to the diffusion current */
  function shapeJ(x, W, L) {
    var u = W / L;
    if (!isFinite(u) || u < 1e-2) return 1 / u;              /* short base */
    var a = (W - x) / L;
    return (Math.exp(a - u) + Math.exp(-a - u)) / (1 - Math.exp(-2 * u));
  }

  /* p = {Na, Nd, Wp, Wn, Ln, Lp, Va}   lengths in cm */
  function model(p) {
    var np0 = NI * NI / p.Na;              /* minority electrons in p */
    var pn0 = NI * NI / p.Nd;              /* minority holes in n     */

    var ex = Math.exp(Math.min(p.Va / VT, 500)) - 1;
    var dnp0 = np0 * ex;                   /* excess at x" = 0 */
    var dpn0 = pn0 * ex;                   /* excess at x' = 0 */

    var uP = p.Wp / p.Ln;                  /* p side  W/L */
    var uN = p.Wn / p.Lp;                  /* n side  W/L */

    /* current from the slope at the SCR edge */
    var Jn = Q * DN * dnp0 / p.Ln * coth(uP);
    var Jp = Q * DP * dpn0 / p.Lp * coth(uN);
    var Jtot = Jn + Jp;

    /* saturation current density: same expression with exp(Va/Vt)-1 = 1 */
    var Jsn = Q * DN * np0 / p.Ln * coth(uP);
    var Jsp = Q * DP * pn0 / p.Lp * coth(uN);
    var Js = Jsn + Jsp;

    /* where the tangent at the SCR edge meets the equilibrium level:
       lambda = L tanh(W/L)  ->  L for a long base,  W for a short base.
       These are exactly the two slope formulas on the lecture slide.      */
    var lamP = p.Ln * Math.tanh(uP);
    var lamN = p.Lp * Math.tanh(uN);

    var Vbi = VT * Math.log(p.Na * p.Nd / (NI * NI));
    var dV = Vbi - p.Va;
    var clamped = dV < 1e-4;
    if (clamped) dV = 1e-4;
    var W = Math.sqrt(2 * EPS0 * ER * dV / Q * (1 / p.Na + 1 / p.Nd));
    var xn = W * p.Na / (p.Na + p.Nd);
    var xp = W * p.Nd / (p.Na + p.Nd);

    /* how far the low level injection assumption is being pushed */
    var inj = Math.max(dnp0 / p.Na, dpn0 / p.Nd);

    return {
      Na: p.Na, Nd: p.Nd, Wp: p.Wp, Wn: p.Wn, Ln: p.Ln, Lp: p.Lp, Va: p.Va,
      np0: np0, pn0: pn0, dnp0: dnp0, dpn0: dpn0,
      npE: np0 + dnp0, pnE: pn0 + dpn0,
      uP: uP, uN: uN, lamP: lamP, lamN: lamN,
      Jn: Jn, Jp: Jp, J: Jtot, Js: Js, Jsn: Jsn, Jsp: Jsp,
      Vbi: Vbi, W: W, xn: xn, xp: xp,
      inj: inj, vbiClamped: clamped
    };
  }

  /* excess minority profiles, x measured from the SCR edge [cm] */
  function excP(m, x) { return m.dnp0 * shape(x, m.Wp, m.Ln); }   /* electrons in p */
  function excN(m, x) { return m.dpn0 * shape(x, m.Wn, m.Lp); }   /* holes in n     */

  /* minority diffusion current at a distance x from the SCR edge.
     Both fall from their edge value towards the contact when W >> L
     (recombination in the neutral region) and stay flat when W << L.   */
  function JnAt(m, x) { return Q * DN * m.dnp0 / m.Ln * shapeJ(x, m.Wp, m.Ln); }
  function JpAt(m, x) { return Q * DP * m.dpn0 / m.Lp * shapeJ(x, m.Wn, m.Lp); }

  return {
    Q: Q, NI: NI, VT: VT, DN: DN, DP: DP, T: T, EPS0: EPS0, ER: ER,
    coth: coth, shape: shape, shapeJ: shapeJ,
    model: model, excP: excP, excN: excN, JnAt: JnAt, JpAt: JpAt
  };
})();
/* PHYSICS-ENGINE-END */

/* ==========================================================================
   SELF TEST - checks the six statements the lecture figures make.
   Run with ?test=1 or runSelfTests() from the console.
   ========================================================================== */
/* SELFTEST-BEGIN */
function runSelfTests(verbose) {
  var UM = 1e-4, log = [], nPass = 0, nFail = 0;
  function P(o) {
    var d = { Na: 1e17, Nd: 1e16, Va: 0.45, Wp: 200 * UM, Wn: 200 * UM,
              Ln: 25 * UM, Lp: 25 * UM };
    for (var k in o) if (o.hasOwnProperty(k)) d[k] = o[k];
    return d;
  }
  function rel(a, b) { return Math.abs(a - b) / Math.max(Math.abs(b), 1e-300); }
  function chk(name, ok, detail) {
    if (ok) nPass++; else nFail++;
    log.push((ok ? 'PASS  ' : 'FAIL  ') + name + (detail ? '\n        ' + detail : ''));
  }
  function e(x, n) { return Number(x).toExponential(n === undefined ? 3 : n); }
  var Q = PHY.Q, VT = PHY.VT, DN = PHY.DN, DP = PHY.DP;

  /* 1 */
  (function () {
    var m = PHY.model(P({ Va: 0 }));
    chk('1  Va = 0  ->  과잉 캐리어와 전류가 정확히 0',
        m.dnp0 === 0 && m.dpn0 === 0 && m.J === 0,
        'dnp0=' + e(m.dnp0) + '  dpn0=' + e(m.dpn0) + '  J=' + e(m.J));
  })();

  /* 2 */
  (function () {
    var m = PHY.model(P({ Va: -0.5 }));
    chk('2  역방향 포화  ->  J = −J_s  (그림 2)', rel(m.J, -m.Js) < 1e-6,
        'J=' + e(m.J) + '   −J_s=' + e(-m.Js) + '   n_p(0)/n_p0=' + e(m.npE / m.np0, 2));
  })();

  /* 3  long base */
  (function () {
    var m = PHY.model(P({ Wp: 400 * UM, Ln: 20 * UM }));
    var worst = 0, i;
    for (i = 0; i <= 300; i++) {
      var x = m.Wp * i / 300;
      worst = Math.max(worst, Math.abs(PHY.shape(x, m.Wp, m.Ln) - Math.exp(-x / m.Ln)));
    }
    var Jideal = Q * DN * m.np0 * (Math.exp(m.Va / VT) - 1) / m.Ln;
    chk('3  Long base (W_p/L_n = ' + m.uP.toFixed(0) + ')  ->  지수 감쇠, J_n = eD_n·n_p0(e^{V/Vt}−1)/L_n,  λ = L_n  (그림 5, 9)',
        worst < 0.01 && rel(m.Jn, Jideal) < 0.01 && rel(m.lamP, m.Ln) < 0.01,
        '형상 최대편차 ' + e(worst, 2) + ' · J_n=' + e(m.Jn) + ' vs ' + e(Jideal) +
        ' · λ=' + e(m.lamP * 1e4, 3) + ' µm, L_n=' + e(m.Ln * 1e4, 3) + ' µm');
  })();

  /* 4  short base */
  (function () {
    var m = PHY.model(P({ Wp: 1 * UM, Ln: 60 * UM }));
    var worst = 0, i;
    for (i = 0; i <= 300; i++) {
      var x = m.Wp * i / 300;
      worst = Math.max(worst, Math.abs(PHY.shape(x, m.Wp, m.Ln) - (1 - x / m.Wp)));
    }
    var Jideal = Q * DN * m.np0 * (Math.exp(m.Va / VT) - 1) / m.Wp;
    chk('4  Short base (W_p/L_n = ' + m.uP.toFixed(3) + ')  ->  직선, J_n = eD_n·n_p0(e^{V/Vt}−1)/W_p,  λ = W_p  (그림 4, 9)',
        worst < 0.01 && rel(m.Jn, Jideal) < 0.01 && rel(m.lamP, m.Wp) < 0.01,
        '형상 최대편차 ' + e(worst, 2) + ' · J_n=' + e(m.Jn) + ' vs ' + e(Jideal) +
        ' · λ=' + e(m.lamP * 1e4, 3) + ' µm, W_p=' + e(m.Wp * 1e4, 3) + ' µm');
  })();

  /* 5  J_n(x) + J_p(x) = J_Total everywhere  (figure 3) */
  (function () {
    var m = PHY.model(P({ Wp: 300 * UM, Wn: 300 * UM, Ln: 20 * UM, Lp: 35 * UM }));
    var worst = 0, i;
    for (i = 0; i <= 200; i++) {                     /* p side */
      var jn = PHY.JnAt(m, m.Wp * i / 200);
      worst = Math.max(worst, rel(jn + (m.J - jn), m.J));
    }
    var edgeP = PHY.JnAt(m, 0), edgeN = PHY.JpAt(m, 0);
    chk('5  J_n(x) + J_p(x) = J_Total 이 위치에 무관하게 성립  (그림 3)',
        worst < 1e-12 && rel(edgeP, m.Jn) < 1e-12 && rel(edgeN, m.Jp) < 1e-12,
        'J_Total=' + e(m.J) + '  J_n(−x_p)=' + e(m.Jn) + '  J_p(x_n)=' + e(m.Jp) +
        '  최대 상대편차 ' + e(worst, 1));
  })();

  /* 6  ideal diode equation */
  (function () {
    var ok = true, rows = [], v;
    for (v = -0.6; v <= 0.61; v += 0.3) {
      var m = PHY.model(P({ Va: v }));
      var want = m.Js * (Math.exp(v / VT) - 1);
      if (rel(m.J, want) > 1e-12) ok = false;
      rows.push('Va=' + v.toFixed(1) + '  J=' + e(m.J) + '  J_s(e^{V/Vt}−1)=' + e(want));
    }
    chk('6  J = J_s·(e^{eV_a/kT} − 1) 를 정확히 따름  (그림 2)', ok, rows.join('\n        '));
  })();

  var text = ['=== pn diode (저준위 주입 이상 모델) 자체 검증 ==='].concat(log)
             .concat(['=== ' + nPass + ' passed, ' + nFail + ' failed ===']).join('\n');
  if (verbose !== false && typeof console !== 'undefined') console.log(text);
  return { pass: nPass, fail: nFail, text: text };
}
/* SELFTEST-END */

/* ==========================================================================
   UI  -  state, sliders, readout
   ========================================================================== */
var UM = 1e-4;                              /* 1 um in cm */
function $(id) { return document.getElementById(id); }
function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

/* ---------------- formatting ---------------- */
function expParts(x, d) {
  var sg = x < 0 ? '−' : '';
  var a = Math.abs(x), ex = Math.floor(Math.log10(a)), m = a / Math.pow(10, ex);
  if (m >= 10 - 0.5 * Math.pow(10, -d)) { m /= 10; ex++; }
  return [sg + m.toFixed(d), ex];
}
function fmtE(x, d) {                       /* HTML <sup> */
  if (x === 0) return '0';
  if (!isFinite(x)) return '—';
  var p = expParts(x, d === undefined ? 2 : d);
  return p[0] + '×10<sup>' + String(p[1]).replace('-', '−') + '</sup>';
}
function fmtEc(x, d) {                      /* canvas: drawSub understands ^{} */
  if (x === 0) return '0';
  if (!isFinite(x)) return '—';
  var p = expParts(x, d === undefined ? 2 : d);
  return p[0] + '×10^{' + String(p[1]).replace('-', '−') + '}';
}
function sig(x, s, expFn) {
  if (!isFinite(x)) return '—';
  s = s || 3;
  var a = Math.abs(x);
  if (a !== 0 && (a >= 1e5 || a < 1e-3)) return expFn(x, s - 1);
  var d = Math.max(0, s - 1 - (a === 0 ? 0 : Math.floor(Math.log10(a))));
  return (x < 0 ? '−' : '') + a.toFixed(Math.min(d, 6));
}
function fmtG(x, s) { return sig(x, s, fmtE); }
function fmtGc(x, s) { return sig(x, s, fmtEc); }
function lenIn(cm, f) {
  var um = cm * 1e4;
  if (!isFinite(um)) return '—';
  if (Math.abs(um) < 0.1) return f(um * 1000) + ' nm';
  if (Math.abs(um) < 1000) return f(um) + ' µm';
  return f(um / 1000) + ' mm';
}

  for (i = 0; i < items.length; i++) wmax = Math.max(wmax, measSub(ctx, items[i].t, LFS));
  var w = wmax + 38, h = items.length * ROW + 7;
  ctx.fillStyle = 'rgba(255,255,255,.86)'; ctx.strokeStyle = '#d6dde6'; ctx.lineWidth = 1;
  ctx.fillRect(x, y, w, h); ctx.strokeRect(x + .5, y + .5, w, h);
  for (i = 0; i < items.length; i++) {
    var yy = y + 5 + (i + 0.5) * ROW;
    ctx.strokeStyle = items[i].c; ctx.lineWidth = items[i].w || 3;
    ctx.setLineDash(items[i].d || []);
    ctx.beginPath(); ctx.moveTo(x + 7, yy); ctx.lineTo(x + 29, yy); ctx.stroke();
    ctx.setLineDash([]);
    drawSub(ctx, items[i].t, x + 34, yy + LFS * 0.35, { size: LFS, col: COL.text });
  }
  ctx.restore();
  return h;
}

/* ==========================================================================
   J - V  characteristic  (linear axes, the ideal diode equation)
   ========================================================================== */
var IV_V0 = -1.0, IV_V1 = 0.8;

function drawIV() {
  var cv = $('cvIV');
  if (ONLY === 'profile') return;
  var f = fitCanvas(cv), ctx = f.ctx, w = f.w, h = f.h;
  var m = MODEL; if (!m) return;
  var box = { l: 74, r: w - 18, t: 44, b: h - 62 };
  if (box.r - box.l < 80 || box.b - box.t < 80) return;

  var Jat = function (v) { return m.Js * (Math.exp(Math.min(v / PHY.VT, 500)) - 1); };
  /* the y axis follows the operating point, so the exponential knee and the
     flat reverse branch are both readable at every bias                     */
  var hi = Math.max(Math.abs(m.J) * 2.4, m.Js * 25);
  var lo = -Math.max(m.Js * 3.2, hi * 0.13);
  var xa = Ax(false, IV_V0, IV_V1, box.l, box.r);
  var ya = Ax(false, lo, hi, box.b, box.t);

  drawFrame(ctx, box, xa, ya, { xlabel: '인가전압  V_a  [V]', ylabel: 'J  [A/cm²]', xn: 5, yn: 5 });

  /* zero line */
  ctx.strokeStyle = '#98a4b2'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(box.l, Math.round(ya.t(0)) + .5);
  ctx.lineTo(box.r, Math.round(ya.t(0)) + .5); ctx.stroke();

  /* the curve */
  var pts = [], i, v;
  for (i = 0; i <= 400; i++) {
    v = IV_V0 + (IV_V1 - IV_V0) * i / 400;
    pts.push([v, Jat(v)]);
  }
  poly(ctx, box, xa, ya, pts, { c: '#2f3aa8', w: LW + 0.6 });

  /* -Js callout: on a linear axis it is indistinguishable from zero,
     which is exactly the point of the figure                            */
  var yJs = ya.t(-m.Js);
  dashLine(ctx, box.l, yJs, box.r, yJs, '#5c6a7c', [5, 4], 1.4);
  drawSub(ctx, '−J_s = ' + fmtGc(m.Js, 2) + ' A/cm²', box.l + 8, yJs + FS + 4,
          { align: 'left', size: FS - 2, bold: 1, col: '#5c6a7c', halo: 0.9 });

  /* operating point */
  var px = xa.t(m.Va), py = Math.max(box.t + 2, Math.min(box.b - 2, ya.t(m.J)));
  ctx.save();
  ctx.beginPath(); ctx.rect(box.l, box.t, box.r - box.l, box.b - box.t); ctx.clip();
  dashLine(ctx, px, box.b, px, py, '#c8102e', [4, 4], 1.4);
  dot(ctx, px, py, 8, '#c8102e');
  ctx.restore();
  drawSub(ctx, 'V_a = ' + m.Va.toFixed(3) + ' V,  J = ' + fmtGc(m.J, 3) + ' A/cm²',
          box.r - 4, box.t - 10, { align: 'right', size: FS - 1, bold: 1, col: '#c8102e' });

  /* equation + bias direction labels */
  drawSub(ctx, 'J = J_s·(e^{eVa/kT} − 1)', box.l + 8, box.t + FS + 6,
          { align: 'left', size: FS + 2, bold: 1, col: '#2f3aa8', halo: 0.9 });
  drawSub(ctx, '← Reverse Bias', box.l + 8, box.b - 7,
          { align: 'left', size: FS - 2, col: '#7c8896', halo: 0.9 });
  drawSub(ctx, 'Forward Bias →', box.r - 8, box.b - 7,
          { align: 'right', size: FS - 2, col: '#7c8896', halo: 0.9 });
  drawSub(ctx, 'y축은 현재 동작점에 맞춰 자동 확대', box.l + 8, box.t + FS * 2.5 + 4,
          { align: 'left', size: FS - 3, col: '#8b96a4', halo: 0.9 });
}

/* click / drag anywhere on the J-V plot moves Va (mouse only operation) */
function initIVMouse() {
  var cv = $('cvIV'), down = false;
  var set = function (ev) {
    var r = cv.getBoundingClientRect();
    var l = 74, rr = r.width - 18;
    var fr = (ev.clientX - r.left - l) / Math.max(1, rr - l);
    var v = IV_V0 + (IV_V1 - IV_V0) * Math.min(1, Math.max(0, fr));
    v = parseFloat((Math.round(v / 0.005) * 0.005).toFixed(3));
    if (v === S.Va) return;
    S.Va = v; showVal('Va'); pushURL(); recompute();
  };
  cv.style.cursor = 'ew-resize';
  cv.addEventListener('mousedown', function (e) { down = true; set(e); e.preventDefault(); });
  window.addEventListener('mousemove', function (e) { if (down) set(e); });
  window.addEventListener('mouseup', function () { down = false; });
}

var rafPending = false;
function drawAll() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(function () {
    rafPending = false;
    try { drawMain(); } catch (e) { console.error(e); }
    try { drawIV(); } catch (e) { console.error(e); }
  });
}

/* ==========================================================================
   MAIN PANEL  -  minority carrier profile (top) and current density (bottom)
   Both share one horizontal layout, exactly as in the lecture figures:
     [ p neutral region ][ SCR ][ n neutral region ]
   The p side runs right-to-left in x", the n side left-to-right in x'.
   ========================================================================== */
function haloText(ctx, txt, x, y, col, align, size, bold) {
  drawSub(ctx, txt, x, y, { align: align, size: size || FS, bold: bold, col: col, halo: true });
}
function arrowHead(ctx, x, y, dx, dy, col, s) {
  var L = Math.sqrt(dx * dx + dy * dy) || 1;
  dx /= L; dy /= L; s = s || 8;
  var px = -dy, py = dx;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - dx * s + px * s * 0.45, y - dy * s + py * s * 0.45);
  ctx.lineTo(x - dx * s - px * s * 0.45, y - dy * s - py * s * 0.45);
  ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
}
function arrowLine(ctx, x0, y0, x1, y1, col, w) {
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = w || 1.8; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  arrowHead(ctx, x1, y1, x1 - x0, y1 - y0, col, 9);
  ctx.restore();
}
function dashLine(ctx, x0, y0, x1, y1, col, dash, w) {
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = w || 1.6; ctx.setLineDash(dash || [5, 4]);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.restore();
}
/* sample points, dense near the SCR edge where the profile bends */
function sampleX(W, L, n) {
  var xs = [], i, near = Math.min(W, 5 * L);
  for (i = 0; i <= n; i++) xs.push(W * i / n);
  if (near < W) for (i = 0; i <= n; i++) xs.push(near * i / n);
  xs.sort(function (a, b) { return a - b; });
  return xs;
}
function baseWord(u) { return u > 5 ? 'long base' : (u < 0.2 ? 'short base' : 'intermediate'); }

/* ---- shared horizontal layout ------------------------------------------- */
function xLayout(m, l, r) {
  var full = r - l;
  /* the SCR is drawn wider than scale so it stays visible, but it still
     breathes with sqrt(Vbi - Va): wider in reverse, narrower in forward   */
  var f = Math.sqrt(Math.max(m.Vbi - m.Va, 1e-4) / m.Vbi);
  var scr = Math.max(full * 0.035, Math.min(full * 0.26, full * 0.10 * f));
  var half = (full - scr) / 2;
  var cxL = l + half, cxR = cxL + scr;
  return {
    l: l, r: r, cxL: cxL, cxR: cxR, half: half, scr: scr,
    p: function (xpp) { return cxL - (xpp / m.Wp) * half; },   /* x" -> px */
    n: function (xp)  { return cxR + (xp / m.Wn) * half; }     /* x' -> px */
  };
}

function drawMain() {
  var cv = $('cvMain');
  if (ONLY === 'iv') return;
  var f = fitCanvas(cv), ctx = f.ctx, w = f.w, h = f.h;
  var m = MODEL; if (!m) return;

  var L = 46, R = w - 46;   /* room for the x" / x' axis captions */
  if (R - L < 120 || h < 220) return;
  var X = xLayout(m, L, R);

  var aTop = 30, aBot = Math.round(h * 0.50);
  var bTop = aBot + 74, bBot = h - 26;
  if (bBot - bTop < 60) { bTop = aBot + 52; bBot = h - 14; }

  drawProfilePanel(ctx, m, X, aTop, aBot);
  drawCurrentPanel(ctx, m, X, bTop, bBot);
}

/* ======================= panel A : carrier profile ======================= */
function drawProfilePanel(ctx, m, X, top, bot) {
  var X0 = X;
  var band = 34;                        /* reserved strip for p_p0 / n_n0 */
  var cTop = top + band + 10, cBot = bot;
  /* one linear scale per side, as the lecture figure draws two "n, p" axes */
  var yMaxP = Math.max(m.npE, m.np0 * 2.2) * 1.12;
  var yMaxN = Math.max(m.pnE, m.pn0 * 2.2) * 1.12;
  var yP = function (v) { return cBot - (v / yMaxP) * (cBot - cTop); };
  var yN = function (v) { return cBot - (v / yMaxN) * (cBot - cTop); };

  /* --- SCR --- */
  ctx.fillStyle = 'rgba(120,132,150,.20)';
  ctx.fillRect(X.cxL, top, X.scr, bot - top);
  ctx.save();
  ctx.translate((X.cxL + X.cxR) / 2, (top + bot) / 2);
  if (X.scr < 60) ctx.rotate(-Math.PI / 2);
  drawSub(ctx, 'SCR', 0, 0, { align: 'center', size: FS, bold: 1, col: '#a3379b' });
  ctx.restore();

  /* --- contacts and baseline --- */
  ctx.strokeStyle = '#5a6675'; ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(X.l + .5, top); ctx.lineTo(X.l + .5, bot);
  ctx.moveTo(X.r - .5, top); ctx.lineTo(X.r - .5, bot);
  ctx.stroke();
  ctx.strokeStyle = COL.axis; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(X.l - 14, bot + .5); ctx.lineTo(X.r + 14, bot + .5); ctx.stroke();
  arrowHead(ctx, X.l - 14, bot + .5, -1, 0, COL.axis, 8);
  arrowHead(ctx, X.r + 14, bot + .5, 1, 0, COL.axis, 8);

  /* vertical "n, p" axes at both SCR edges, as in the figures */
  [X.cxL, X.cxR].forEach(function (cx) {
    arrowLine(ctx, cx, bot, cx, top - 8, COL.axis, 1.6);
  });
  drawSub(ctx, 'n, p', (X.cxL + X.cxR) / 2, top - 12, { align: 'center', size: FS, bold: 1, col: '#444' });

  /* --- majority reference lines in the top strip (way off scale) --- */
  var hiIsNa = m.Na >= m.Nd;
  var yHi = top + 11, yLo = top + 27;
  dashLine(ctx, X.l, hiIsNa ? yHi : yLo, X.cxL, hiIsNa ? yHi : yLo, COL.hole, [6, 4], 1.8);
  dashLine(ctx, X.cxR, hiIsNa ? yLo : yHi, X.r, hiIsNa ? yLo : yHi, COL.elec, [6, 4], 1.8);
  haloText(ctx, 'p_{p0} = ' + fmtEc(m.Na, 1) + '  (축척 밖)', X.l + 6,
           (hiIsNa ? yHi : yLo) - 4, COL.hole, 'left', FS - 3, true);
  haloText(ctx, 'n_{n0} = ' + fmtEc(m.Nd, 1) + '  (축척 밖)', X.r - 6,
           (hiIsNa ? yLo : yHi) - 4, COL.elec, 'right', FS - 3, true);
  ctx.save();                                   /* axis break */
  ctx.strokeStyle = '#aab4c0'; ctx.lineWidth = 1.3; ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.moveTo(X.l, top + band + 2); ctx.lineTo(X.r, top + band + 2); ctx.stroke();
  ctx.restore();

  /* --- equilibrium levels --- */
  dashLine(ctx, X.l, yP(m.np0), X.cxL, yP(m.np0), COL.elec, [4, 4], 1.6);
  dashLine(ctx, X.cxR, yN(m.pn0), X.r, yN(m.pn0), COL.hole, [4, 4], 1.6);

  /* --- profiles --- */
  var i, xs, pts = [];
  xs = sampleX(m.Wp, m.Ln, 240);
  for (i = 0; i < xs.length; i++) pts.push([X.p(xs[i]), yP(m.np0 + PHY.excP(m, xs[i]))]);
  strokePts(ctx, pts, COL.elec, LW + 0.4);
  pts = [];
  xs = sampleX(m.Wn, m.Lp, 240);
  for (i = 0; i < xs.length; i++) pts.push([X.n(xs[i]), yN(m.pn0 + PHY.excN(m, xs[i]))]);
  strokePts(ctx, pts, COL.hole, LW + 0.4);

  /* --- tangent at the SCR edge: it meets the equilibrium level at
         lambda = L tanh(W/L), i.e. at L for a long base and at W for a
         short base.  That is the slide's dn_p/dx formula, drawn.        --- */
  var tan = function (side) {
    var isP = side === 'p';
    var lam = isP ? m.lamP : m.lamN;
    var y0 = isP ? yP(m.npE) : yN(m.pnE);
    var y1 = isP ? yP(m.np0) : yN(m.pn0);
    var x0 = isP ? X.cxL : X.cxR;
    var x1 = isP ? X.p(lam) : X.n(lam);
    dashLine(ctx, x0, y0, x1, y1, '#2c333d', [7, 5], 1.8);
    ctx.beginPath(); ctx.arc(x1, y1, 4, 0, 6.2832);
    ctx.fillStyle = '#2c333d'; ctx.fill();
    var u = isP ? m.uP : m.uN, nm = isP ? 'L_n' : 'L_p', wn = isP ? 'W_p' : 'W_n';
    var lab = (u > 5 ? ('λ = ' + nm) : (u < 0.2 ? ('λ = ' + wn) : 'λ')) + ' = ' + fmtLenC(lam);
    var tw = measSub(ctx, lab, FS - 2, 1);
    var lx = x1 + (isP ? -9 : 9);
    lx = Math.max(X0.l + 4 + (isP ? tw : 0), Math.min(X0.r - 4 - (isP ? 0 : tw), lx));
    haloText(ctx, lab, lx, y1 - 8, '#2c333d', isP ? 'right' : 'left', FS - 2, true);
    var sl = isP ? 'dn_p/dx″' : 'dp_n/dx′';
    haloText(ctx, sl, (x0 + x1) / 2 + (isP ? -6 : 6), (y0 + y1) / 2 - 8, '#2c333d',
             isP ? 'right' : 'left', FS - 2, true);
  };
  tan('p'); tan('n');

  /* --- edge markers --- */
  dot(ctx, X.cxL, yP(m.npE), 7, COL.elec);
  dot(ctx, X.cxR, yN(m.pnE), 7, COL.hole);
  haloText(ctx, 'n_p(0) = ' + fmtGc(m.npE, 3), X.cxL - 11, yP(m.npE) - 9, COL.elec, 'right', FS - 2, true);
  haloText(ctx, 'p_n(0) = ' + fmtGc(m.pnE, 3), X.cxR + 11, yN(m.pnE) - 9, COL.hole, 'left', FS - 2, true);
  haloText(ctx, 'n_{p0}', X.l + (X.cxL - X.l) * 0.30, yP(m.np0) + FS + 3, COL.elec, 'center', FS - 2);
  haloText(ctx, 'p_{n0}', X.r - (X.r - X.cxR) * 0.30, yN(m.pn0) + FS + 3, COL.hole, 'center', FS - 2);

  /* --- carrier flow arrows (they reverse with the bias) --- */
  if (Math.abs(m.Va) > 0.02) {
    var fwd = m.Va > 0, ay = cBot - (cBot - cTop) * 0.16, d = 34;
    var xe = X.cxL - X.half * 0.30, xh = X.cxR + X.half * 0.30;
    arrowLine(ctx, xe + (fwd ? d : -d), ay, xe + (fwd ? -d : d), ay, COL.elec, 2.2);
    arrowLine(ctx, xh + (fwd ? -d : d), ay, xh + (fwd ? d : -d), ay, COL.hole, 2.2);
    haloText(ctx, '전자', xe, ay - 10, COL.elec, 'center', FS - 2, true);
    haloText(ctx, '정공', xh, ay - 10, COL.hole, 'center', FS - 2, true);
  }

  /* --- x axis annotation --- */
  var tickV = function (px, txt, col) {
    ctx.strokeStyle = COL.axis; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(px + .5, bot); ctx.lineTo(px + .5, bot + 7); ctx.stroke();
    if (txt) drawSub(ctx, txt, px, bot + 8 + FS, { align: 'center', size: FS - 1, col: col || COL.text });
  };
  tickV(X.l, ''); tickV(X.cxL, 'x″=0'); tickV(X.cxR, 'x′=0'); tickV(X.r, '');
  drawSub(ctx, 'x″', X.l - 17, bot + 8 + FS, { align: 'right', size: FS, bold: 1 });
  drawSub(ctx, 'x′', X.r + 17, bot + 8 + FS, { align: 'left', size: FS, bold: 1 });
  drawSub(ctx, 'W_p = ' + fmtGc(m.Wp * 1e4, 3) + ' µm · ' + baseWord(m.uP),
          (X.l + X.cxL) / 2, bot + 8 + FS * 2.2, { align: 'center', size: FS - 1, col: COL.elec, bold: 1 });
  drawSub(ctx, 'W_n = ' + fmtGc(m.Wn * 1e4, 3) + ' µm · ' + baseWord(m.uN),
          (X.cxR + X.r) / 2, bot + 8 + FS * 2.2, { align: 'center', size: FS - 1, col: COL.hole, bold: 1 });
}

/* ======================= panel B : current density ======================= */
function drawCurrentPanel(ctx, m, X, top, bot) {
  var lo = Math.min(0, m.J * 1.3), hi = Math.max(0, m.J * 1.3);
  if (hi - lo < 1e-300) { lo = -1; hi = 1; }
  var y = function (v) { return bot - (v - lo) / (hi - lo) * (bot - top); };

  /* SCR guides */
  dashLine(ctx, X.cxL, top - 4, X.cxL, bot, '#8d97a5', [4, 4], 1.3);
  dashLine(ctx, X.cxR, top - 4, X.cxR, bot, '#8d97a5', [4, 4], 1.3);
  ctx.fillStyle = 'rgba(120,132,150,.10)';
  ctx.fillRect(X.cxL, top - 4, X.scr, bot - top + 4);

  /* axes */
  ctx.strokeStyle = COL.axis; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(X.l - 14, y(0) + .5); ctx.lineTo(X.r + 14, y(0) + .5); ctx.stroke();
  arrowHead(ctx, X.r + 14, y(0) + .5, 1, 0, COL.axis, 8);
  arrowLine(ctx, (X.cxL + X.cxR) / 2, bot, (X.cxL + X.cxR) / 2, top - 10, COL.axis, 1.6);
  drawSub(ctx, 'Current density', (X.cxL + X.cxR) / 2, top - 15,
          { align: 'center', size: FS - 1, bold: 1, col: '#444', halo: 0.9 });
  drawSub(ctx, 'x', X.r + 18, y(0) + FS * 0.4, { align: 'left', size: FS, bold: 1 });

  /* J_n(x) and J_p(x) */
  var i, xs, jn = [], jp = [];
  xs = sampleX(m.Wp, m.Ln, 200);
  for (i = xs.length - 1; i >= 0; i--) {
    var Jn = PHY.JnAt(m, xs[i]);
    jn.push([X.p(xs[i]), y(Jn)]); jp.push([X.p(xs[i]), y(m.J - Jn)]);
  }
  jn.push([X.cxL, y(m.Jn)]); jp.push([X.cxL, y(m.Jp)]);
  jn.push([X.cxR, y(m.Jn)]); jp.push([X.cxR, y(m.Jp)]);
  xs = sampleX(m.Wn, m.Lp, 200);
  for (i = 0; i < xs.length; i++) {
    var Jp = PHY.JpAt(m, xs[i]);
    jp.push([X.n(xs[i]), y(Jp)]); jn.push([X.n(xs[i]), y(m.J - Jp)]);
  }
  /* J_total */
  ctx.strokeStyle = '#101418'; ctx.lineWidth = LW;
  ctx.beginPath(); ctx.moveTo(X.l, y(m.J)); ctx.lineTo(X.r, y(m.J)); ctx.stroke();
  strokePts(ctx, jn, COL.elec, LW);
  strokePts(ctx, jp, COL.hole, LW);

  dot(ctx, X.cxL, y(m.Jn), 6.5, COL.elec);
  dot(ctx, X.cxR, y(m.Jp), 6.5, COL.hole);

  /* labels straight from the lecture figure */
  haloText(ctx, 'J_{Total} = J_n(−x_p) + J_p(x_n) = ' + fmtGc(m.J, 3) + ' A/cm²',
           (X.l + X.r) / 2, top + FS - 2, '#101418', 'center', FS - 2, true);
  haloText(ctx, 'J_n(−x_p)', X.cxL - 10, y(m.Jn) - 9, COL.elec, 'right', FS - 2, true);
  haloText(ctx, 'J_p(x_n)', X.cxR + 10, y(m.Jp) - 9, COL.hole, 'left', FS - 2, true);
  /* the two "= J_Total - X" curves approach J_Total from inside, so their
     captions go on the far side of the curve from the J_Total line        */
  var xlp = m.Wp * 0.42, xln = m.Wn * 0.42;
  var jnp = PHY.JnAt(m, xlp), jpn = PHY.JpAt(m, xln);
  var oDiff = m.J >= 0 ? -9 : (FS + 7);        /* diffusion curves: outward */
  var oComp = m.J >= 0 ? (FS + 7) : -9;        /* complement curves: inward */
  haloText(ctx, 'J_n = eD_n·d(δn_p)/dx', X.p(xlp), y(jnp) + oDiff, COL.elec, 'center', FS - 3);
  haloText(ctx, 'J_p = J_{Total} − J_n', X.p(xlp), y(m.J - jnp) + oComp, COL.hole, 'center', FS - 3);
  haloText(ctx, 'J_p = −eD_p·d(δp_n)/dx', X.n(xln), y(jpn) + oDiff, COL.hole, 'center', FS - 3);
  haloText(ctx, 'J_n = J_{Total} − J_p', X.n(xln), y(m.J - jpn) + oComp, COL.elec, 'center', FS - 3);
  if (m.uP < 0.35 && m.uN < 0.35)
    haloText(ctx, '중성영역 재결합 거의 없음 → J_n, J_p 각각 일정',
             (X.l + X.r) / 2, top + FS * 2.4, '#4a5666', 'center', FS - 2, true);
  drawSub(ctx, 'p', X.l + 10, top + FS, { align: 'left', size: FS, bold: 1, col: '#a3379b' });
  drawSub(ctx, 'n', X.r - 10, top + FS, { align: 'right', size: FS, bold: 1, col: '#a3379b' });
}

/* plain polyline in pixel coordinates */
function strokePts(ctx, pts, col, w) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.setLineDash([]);
  ctx.beginPath();
  var started = false;
  for (var i = 0; i < pts.length; i++) {
    if (!isFinite(pts[i][0]) || !isFinite(pts[i][1])) { started = false; continue; }
    if (!started) { ctx.moveTo(pts[i][0], pts[i][1]); started = true; }
    else ctx.lineTo(pts[i][0], pts[i][1]);
  }
  ctx.stroke();
  ctx.restore();
}

/* ========================================================================== */
var MODEL = null;

function recompute() {
  MODEL = PHY.model(phyParams());
  updateReadout(MODEL);
  updateNote(MODEL);
  drawAll();
}
function copyLink() {
  var url = buildURL(), b = $('btnLink'), old = b.textContent;
  var done = function (ok) {
    b.textContent = ok ? '복사됨 ✓' : '복사 실패';
    setTimeout(function () { b.textContent = old; }, 1500);
  };
  try {
    var ta = document.createElement('textarea');
    ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) { done(true); return; }
  } catch (e) {}
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(
    function () { done(true); }, function () { window.prompt('아래 주소를 복사하세요', url); });
  else window.prompt('아래 주소를 복사하세요', url);
}

function boot() {
  var q = readURL();
  mkSlider($('slBias'), 'Va');
  mkSlider($('slW'), 'Wp'); mkSlider($('slW'), 'Wn');
  mkSlider($('slL'), 'Ln'); mkSlider($('slL'), 'Lp');
  mkSlider($('slDope'), 'Na'); mkSlider($('slDope'), 'Nd');
  buildReadout();

  Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function (e) {
    e.addEventListener('click', function () { applyPreset(e.getAttribute('data-preset')); });
  });
  $('btnLink').addEventListener('click', copyLink);

  if (EMBED) document.body.classList.add('embed');
  if (ONLY) {
    document.body.classList.add('single');
    $(ONLY === 'iv' ? 'cardMain' : 'cardIV').style.display = 'none';
  }

  syncControls();
  initIVMouse();
  recompute();

  if (q.test === '1') {
    var p = $('selftest');
    p.textContent = runSelfTests(false).text + '\n\n(클릭하면 닫힙니다)';
    p.classList.add('show');
    p.addEventListener('click', function () { p.classList.remove('show'); });
  }

  window.addEventListener('resize', drawAll);
  if (window.ResizeObserver) new ResizeObserver(drawAll).observe($('plots'));
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
